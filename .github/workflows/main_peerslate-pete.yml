# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - peerslate-pete

# DISABLED (2026-07-16, PS-RULES-001): Azure Pipelines is the ONLY
# production deployment path (docs/AI_WORKFLOW.md, PEERSLATE_SITE_RULES.md
# rule 79). This workflow is retained as history; the push trigger was
# removed so a repository-settings change can never silently re-enable
# GitHub deployment.
#
# DISARMED (2026-08-03, overnight audit finding F-01): `workflow_dispatch`
# was still present, so this file stayed a runnable deploy path gated only by
# repository policy rather than by the file itself. The trigger is removed
# entirely; a workflow with no `on:` trigger cannot execute, by manual
# dispatch or otherwise. The Azure-side federated credential and the
# Website Contributor role assignment behind the OIDC path were deleted the
# same night. The stored publish-profile repository secret must be deleted in
# GitHub by the owner; rotating the publish profile in Azure invalidates it
# immediately.
#
# Retained as history only. Do not restore a trigger. Re-enabling GitHub
# deployment is a governance decision in docs/AI_WORKFLOW.md first.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # Matches the Python runtime the Azure Web App actually runs
      # (portal -> Configuration -> Stack settings), so this CI install
      # tests the same environment production uses.
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      # The design-reference folders below (mockups, background source
      # images, docs that aren't loaded by the app) are excluded because
      # the site never serves them — shipping them made every deploy
      # ~60 MB. NOTE: docs/knowledge/ must always deploy: app.py loads
      # it at startup for the chatbot.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !static/Mockup/
            !static/Background/
            !static/images/Mockups/
            !static/images/background-templates/
            !Design ideas/
            !docs/session_log_2026-06-27.txt

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'peerslate-pete'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C15EB685278E4B1DAC576288F091E4FE }}