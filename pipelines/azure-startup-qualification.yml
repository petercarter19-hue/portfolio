# Active definition for PS-AZURE-STARTUP-ACTIVATION-001.
#
# The two daily schedules are deliberately redundant.  App Configuration holds
# a non-secret UTC success marker, so the second run spends nothing when the
# first Foundry run reached its reviewed fresh-input target.  The fallback can
# recover a transient early-day failure without relying on a person.
trigger: none
pr: none
lockBehavior: sequential

parameters:
  - name: qualificationSpeechProofEndpoint
    displayName: One-time Speech proof endpoint
    type: string
    default: ''
  - name: qualificationSpeechProofAuthorizationRef
    displayName: One-time Speech proof authorization reference
    type: string
    default: ''

schedules:
  - cron: '20 1 * * *'
    displayName: Primary daily qualification run
    batch: true
    branches:
      include:
        - main
    always: true
  - cron: '20 13 * * *'
    displayName: Daily qualification recovery run
    batch: true
    branches:
      include:
        - main
    always: true

variables:
  vmImageName: 'ubuntu-latest'
  pythonVersion: '3.12'
  # This passwordless connection is dedicated to qualification.  It is not the
  # production deploy/migration connection in azure-pipelines.yml.
  qualificationServiceConnectionId: 'peerslate-startup-qualification-wif'
  qualificationActivationEnabled: 'true'
  qualificationCreditConfirmed: 'true'
  qualificationSpendAuthorizationRef: 'session:01a046b3-74fc-7903-a336-3f1647f81d1c/owner-authorization:2026-09-04/start-seven-azure-workload-plan'
  qualificationSpeechAuthorizationRef: ${{ parameters.qualificationSpeechProofAuthorizationRef }}
  # Use the data-plane endpoint so this identity needs no ARM Reader role just
  # to discover a store it already has exact App Configuration data access to.
  qualificationAppConfigurationEndpoint: 'https://peerslate-startup-qualification.azconfig.io'
  qualificationFoundryEndpoint: 'https://peerslate-foundry.openai.azure.com'
  qualificationFoundryDeployment: 'gpt-5.6-luna'
  # Keep scheduled Speech disabled until one reviewed, manually queued proof
  # supplies the exact pinned endpoint and authorization reference through
  # manual-run parameters and succeeds. Scheduled runs retain both empty
  # defaults. The runner accepts the proof authorization exactly once using a
  # new durable marker; older markers are never reset or reused.
  qualificationSpeechEndpoint: ${{ parameters.qualificationSpeechProofEndpoint }}
  qualificationContainerRegistryEndpoint: 'https://peerslateacr.azurecr.io'
  # Nine distinct product-aligned cases run once: the call count and spend
  # envelope stay identical to the reviewed three-cases-times-three plan.
  qualificationEvaluationRepeats: '1'
  qualificationSyntheticContextRecords: '13000'
  qualificationMinimumFreshInputTokens: '2800000'
  qualificationMinimumInputTokensPerCall: '272001'
  qualificationMaximumInputTokens: '350000'
  qualificationMaximumInputBytes: '1800000'
  qualificationMaximumOutputTokens: '2000'
  qualificationMinimumCallIntervalSeconds: '65'
  qualificationFoundryHardCapUsd: '3.25'

stages:
  - stage: Inactive
    displayName: Confirm qualification automation is inactive
    condition: ne(variables['qualificationActivationEnabled'], 'true')
    jobs:
      - job: InactiveByDesign
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: none
          - script: |
              echo "Azure startup qualification automation is inactive by design."
              echo "No Azure query or paid model call was made."
            displayName: Report inactive state

  - stage: QualificationStatus
    displayName: Read five- and seven-workload continuity
    condition: >-
      and(
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpendAuthorizationRef'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: ReadOnlyCostStatus
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - task: AzureCLI@2
            displayName: Query privacy-safe Cost Management status
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_subscription_id=$(az account show --query id -o tsv)
                python -m pip install --disable-pip-version-check --no-input --quiet \
                  azure-identity==1.25.3 \
                  azure-mgmt-costmanagement==5.0.0 \
                  requests==2.34.2
                qualification_status_file="$AGENT_TEMPDIRECTORY/qualification-status.json"
                set +e
                python scripts/azure_startup_qualification_status.py \
                  --subscription-id "$qualification_subscription_id" \
                  --pretty \
                  --require-five-qualified-latest-day \
                  > "$qualification_status_file"
                qualification_status_exit=$?
                set -e
                qualification_summary_file="$AGENT_TEMPDIRECTORY/qualification-status.md"
                python - "$qualification_status_file" "$qualification_summary_file" <<'PY'
                import json
                import sys
                from pathlib import Path

                def write_summary(lines):
                    Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")

                try:
                    report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
                    if not isinstance(report, dict):
                        raise ValueError("status document is not an object")
                    latest = report.get("latest_day")
                except (OSError, UnicodeError, json.JSONDecodeError, ValueError):
                    write_summary(
                        [
                            "# Azure startup qualification status",
                            "",
                            "Billing status is unavailable for this run.",
                            "",
                            "The workload stages continue independently; the tracker remains fail-closed until a valid Azure billing response is available.",
                        ]
                    )
                    raise SystemExit(0)
                if latest is None:
                    lines = [
                        "# Azure startup qualification status",
                        "",
                        "No complete UTC Cost Management day is available yet.",
                        "",
                        "This is a conservative Cost Management estimate. The Microsoft for Startups portal remains authoritative.",
                    ]
                    write_summary(lines)
                    raise SystemExit(0)
                if not isinstance(latest, dict):
                    write_summary(
                        [
                            "# Azure startup qualification status",
                            "",
                            "Billing status is unavailable for this run.",
                            "",
                            "The tracker refused an invalid Azure billing response.",
                        ]
                    )
                    raise SystemExit(0)
                costs = latest["workload_cost_usd"]
                streaks = report["current_workload_streak_days"]
                labels = {item["key"]: item["label"] for item in report["workloads"]}
                known_sources = {
                    "Azure Cost Management ActualCost estimate",
                    "Azure Cost Management Cost Details ActualCost fallback",
                }
                source = report.get("status_source")
                source_label = source if source in known_sources else "Azure billing estimate"
                lines = [
                    "# Azure startup qualification status",
                    "",
                    f"Latest complete UTC day: **{latest['day']}**",
                    f"Billing data source: **{source_label}**",
                    f"Five-service day qualified: **{'yes' if latest['qualifies_five'] else 'no'}**",
                    f"Seven-service day qualified: **{'yes' if latest['qualifies_seven'] else 'no'}**",
                    f"Current uninterrupted five-service streak: **{report['current_five_workload_streak_days']} days**",
                    f"Current uninterrupted seven-service streak: **{report['current_seven_workload_streak_days']} days**",
                    "",
                    "| Workload | Cost | Above $1 | Current streak |",
                    "|---|---:|:---:|---:|",
                ]
                for key in sorted(labels):
                    value = costs.get(key, 0)
                    lines.append(
                        f"| {labels[key]} | ${value:.4f} | {'Yes' if value > 1 else 'No'} | {streaks[key]} days |"
                    )
                lines.extend(
                    [
                        "",
                        "This is a conservative Cost Management estimate. The Microsoft for Startups portal remains authoritative.",
                    ]
                )
                if report.get("fallback_reason") == "cost_management_rate_limited":
                    lines.extend(
                        [
                            "",
                            "Cost Management was rate-limited, so this run used the bounded Azure Cost Details report fallback.",
                        ]
                    )
                write_summary(lines)
                PY
                echo "##vso[task.uploadsummary]$qualification_summary_file"
                exit "$qualification_status_exit"

  - stage: RegistryVerification
    displayName: Verify the product container registry is readable
    dependsOn: QualificationStatus
    condition: >-
      and(
        always(),
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpendAuthorizationRef'], ''),
        ne(variables['qualificationContainerRegistryEndpoint'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: ReadOnlyRegistryVerification
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: Verify registry catalog access without listing names
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_registry_aad_token=$(az account get-access-token \
                  --resource 'https://containerregistry.azure.net' \
                  --query accessToken \
                  --output tsv \
                  --only-show-errors)
                qualification_registry_tenant=$(az account show \
                  --query tenantId \
                  --output tsv \
                  --only-show-errors)
                QUALIFICATION_REGISTRY_ENDPOINT="$(qualificationContainerRegistryEndpoint)" \
                QUALIFICATION_REGISTRY_AAD_TOKEN="$qualification_registry_aad_token" \
                QUALIFICATION_REGISTRY_TENANT="$qualification_registry_tenant" \
                python3 - <<'PY'
                import json
                import os
                import re
                import urllib.error
                import urllib.parse
                import urllib.request

                endpoint = os.environ.get("QUALIFICATION_REGISTRY_ENDPOINT", "")
                expected_endpoint = "https://peerslateacr.azurecr.io"
                service = "peerslateacr.azurecr.io"
                aad_token = os.environ.get("QUALIFICATION_REGISTRY_AAD_TOKEN", "")
                tenant = os.environ.get("QUALIFICATION_REGISTRY_TENANT", "")
                if endpoint != expected_endpoint:
                    raise SystemExit("Registry endpoint is not the pinned origin.")
                if not re.fullmatch(r"[0-9a-fA-F-]{36}", tenant):
                    raise SystemExit("Registry tenant identifier is invalid.")
                if not 40 <= len(aad_token) <= 24_000 or any(char.isspace() for char in aad_token):
                    raise SystemExit("Registry workload token is invalid.")

                class RefuseRedirects(urllib.request.HTTPRedirectHandler):
                    def redirect_request(self, req, fp, code, msg, headers, newurl):
                        return None

                opener = urllib.request.build_opener(RefuseRedirects)

                def exact_json(path, *, form=None, bearer=None, field=None):
                    url = endpoint + path
                    parsed = urllib.parse.urlsplit(url)
                    if (
                        parsed.scheme != "https"
                        or parsed.netloc != "peerslateacr.azurecr.io"
                        or parsed.username is not None
                        or parsed.password is not None
                        or parsed.port is not None
                    ):
                        raise SystemExit("Registry request origin is invalid.")
                    data = None
                    headers = {"Accept": "application/json"}
                    if form is not None:
                        data = urllib.parse.urlencode(form).encode("ascii")
                        headers["Content-Type"] = "application/x-www-form-urlencoded"
                    if bearer is not None:
                        headers["Authorization"] = "Bearer " + bearer
                    request = urllib.request.Request(url, data=data, headers=headers)
                    try:
                        with opener.open(request, timeout=30) as response:
                            if response.status != 200 or response.geturl() != url:
                                raise SystemExit("Registry data-plane request was refused.")
                            body = response.read(65_537)
                    except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:
                        raise SystemExit("Registry data-plane request failed.") from error
                    if len(body) > 65_536:
                        raise SystemExit("Registry response exceeded its safe bound.")
                    try:
                        payload = json.loads(body)
                    except (UnicodeDecodeError, json.JSONDecodeError) as error:
                        raise SystemExit("Registry response was malformed.") from error
                    if not isinstance(payload, dict):
                        raise SystemExit("Registry response shape was invalid.")
                    if field is not None:
                        if set(payload) != {field}:
                            raise SystemExit("Registry token response fields were not exact.")
                        token = payload[field]
                        if (
                            not isinstance(token, str)
                            or not 40 <= len(token) <= 24_000
                            or any(char.isspace() for char in token)
                        ):
                            raise SystemExit("Registry token response was invalid.")
                        return token
                    return payload

                refresh_token = exact_json(
                    "/oauth2/exchange",
                    form={
                        "grant_type": "access_token",
                        "service": service,
                        "tenant": tenant,
                        "access_token": aad_token,
                    },
                    field="refresh_token",
                )
                catalog_token = exact_json(
                    "/oauth2/token",
                    form={
                        "grant_type": "refresh_token",
                        "service": service,
                        "scope": "registry:catalog:*",
                        "refresh_token": refresh_token,
                    },
                    field="access_token",
                )
                catalog = exact_json("/v2/_catalog?n=1", bearer=catalog_token)
                if set(catalog) != {"repositories"} or not isinstance(catalog["repositories"], list):
                    raise SystemExit("Registry catalog response fields were not exact.")
                if len(catalog["repositories"]) > 1 or any(
                    not isinstance(name, str) or len(name) > 256
                    for name in catalog["repositories"]
                ):
                    raise SystemExit("Registry catalog response was outside its bound.")
                print(
                    "Registry data-plane catalog access succeeded; "
                    f"bounded page entries: {len(catalog['repositories'])}. Names were not emitted."
                )
                PY
                unset qualification_registry_aad_token qualification_registry_tenant

  - stage: FoundryEvaluation
    displayName: Run bounded Luna evaluations
    dependsOn: QualificationStatus
    condition: >-
      and(
        always(),
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpendAuthorizationRef'], ''),
        ne(variables['qualificationFoundryEndpoint'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: BoundedFoundryEvaluation
        timeoutInMinutes: 30
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - task: AzureCLI@2
            displayName: Run structural evaluations under the hard dollar cap
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_enabled=$(az appconfig kv show \
                  --endpoint "$(qualificationAppConfigurationEndpoint)" \
                  --key "qualification/enabled" \
                  --auth-mode login \
                  --query value \
                  --output tsv \
                  --only-show-errors)
                if [ "$qualification_enabled" != "true" ]; then
                  echo "Qualification automation is disabled in App Configuration."
                  exit 2
                fi
                qualification_today=$(date -u +%F)
                qualification_last_success=$(az appconfig kv show \
                  --endpoint "$(qualificationAppConfigurationEndpoint)" \
                  --key "qualification/foundry/last-success-day" \
                  --auth-mode login \
                  --query value \
                  --output tsv \
                  --only-show-errors)
                if [ "$qualification_last_success" = "$qualification_today" ]; then
                  echo "Foundry fresh-input target already reached for $qualification_today; no paid call is needed."
                  exit 0
                fi
                qualification_result_file="$AGENT_TEMPDIRECTORY/foundry-evaluation.json"
                set +e
                python scripts/run_foundry_luna_evaluations.py \
                  --execute \
                  --endpoint "$(qualificationFoundryEndpoint)" \
                  --deployment "$(qualificationFoundryDeployment)" \
                  --repeat "$(qualificationEvaluationRepeats)" \
                  --synthetic-context-records "$(qualificationSyntheticContextRecords)" \
                  --minimum-fresh-input-tokens "$(qualificationMinimumFreshInputTokens)" \
                  --minimum-input-tokens-per-call "$(qualificationMinimumInputTokensPerCall)" \
                  --maximum-input-tokens "$(qualificationMaximumInputTokens)" \
                  --maximum-input-bytes "$(qualificationMaximumInputBytes)" \
                  --maximum-output-tokens "$(qualificationMaximumOutputTokens)" \
                  --minimum-call-interval-seconds "$(qualificationMinimumCallIntervalSeconds)" \
                  --hard-cap-usd "$(qualificationFoundryHardCapUsd)" \
                  > "$qualification_result_file"
                qualification_runner_exit=$?
                set -e
                qualification_marker_eligible=$(python -c 'import json,sys; print(str(bool(json.load(open(sys.argv[1], encoding="utf-8")).get("success_marker_eligible"))).lower())' "$qualification_result_file")
                if [ "$qualification_marker_eligible" = "true" ]; then
                  az appconfig kv set \
                    --endpoint "$(qualificationAppConfigurationEndpoint)" \
                    --key "qualification/foundry/last-success-day" \
                    --value "$qualification_today" \
                    --auth-mode login \
                    --yes \
                    --output none \
                    --only-show-errors
                fi
                qualification_summary_file="$AGENT_TEMPDIRECTORY/foundry-evaluation.md"
                python - "$qualification_result_file" "$qualification_summary_file" <<'PY'
                import json
                import sys

                report = json.load(open(sys.argv[1], encoding="utf-8"))
                maximum_calls = report.get("maximum_calls", 0)
                passed = report.get("passed", 0)
                lines = [
                    "# Foundry Luna daily product-quality evaluation",
                    "",
                    f"Mode: **{report['mode']}**",
                    (
                        "Success marker eligible: **"
                        f"{'yes' if report.get('success_marker_eligible') else 'no'}**"
                    ),
                    (
                        "Fresh-input target reached: **"
                        f"{'yes' if report.get('fresh_input_target_reached') else 'no'}**"
                    ),
                    f"Automated quality checks passed: **{passed}/{maximum_calls}**",
                    (
                        "All automated quality checks passed: **"
                        f"{'yes' if report.get('quality_checks_passed') else 'no'}**"
                    ),
                    f"Calls billed: **{report.get('calls_billed', 0)}**",
                    f"Fresh input tokens: **{report.get('fresh_input_tokens', 0):,}**",
                    f"Cached input tokens: **{report.get('cached_input_tokens', 0):,}**",
                    f"Output tokens: **{report.get('output_tokens', 0):,}**",
                    f"Safety-schedule estimate: **${report.get('estimated_cost_usd', 0):.4f}**",
                    "",
                    "| Product | Capability | Benchmark | Result |",
                    "|---|---|---|---|",
                ]
                if report.get("stop_category"):
                    lines[3:3] = [
                        f"Stop category: **{report['stop_category']}**",
                    ]
                for item in report.get("case_results", []):
                    attempts = item.get("attempts", 0)
                    result = (
                        f"{item.get('passed', 0)}/{attempts} passed"
                        if attempts
                        else "not run"
                    )
                    lines.append(
                        f"| {item['product']} | {item['capability']} | "
                        f"{item['benchmark_ref']} | {result} |"
                    )
                failure_categories = report.get("failure_categories", {})
                if failure_categories:
                    lines.extend(["", "Failure categories:"])
                    lines.extend(
                        f"- {category}: {count}"
                        for category, count in sorted(failure_categories.items())
                    )
                lines.extend(
                    [
                        "",
                        (
                            "This is a synthetic foundation-level behavioral smoke "
                            "suite, not a human quality score or proof of production "
                            "prompt parity."
                        ),
                        "Prompts and model output are not retained in this report.",
                    ]
                )
                open(sys.argv[2], "w", encoding="utf-8").write("\n".join(lines) + "\n")
                PY
                echo "##vso[task.uploadsummary]$qualification_summary_file"
                exit "$qualification_runner_exit"
            env:
              PEERSLATE_AZURE_QUALIFICATION_ACTIVATED: $(qualificationActivationEnabled)
              PEERSLATE_AZURE_CREDIT_CONFIRMED: $(qualificationCreditConfirmed)
              PEERSLATE_AZURE_SPEND_AUTHORIZATION_REF: $(qualificationSpendAuthorizationRef)

  - stage: SpeechEvaluation
    displayName: Run bounded synthetic Speech regressions
    dependsOn: QualificationStatus
    condition: >-
      and(
        always(),
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpeechAuthorizationRef'], ''),
        ne(variables['qualificationSpeechEndpoint'], ''),
        ne(variables['qualificationAppConfigurationEndpoint'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: BoundedSpeechEvaluation
        timeoutInMinutes: 90
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - script: |
              set -euo pipefail
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
              python -m pip install --disable-pip-version-check \
                azure-appconfiguration==1.9.0 \
                azure-identity==1.25.3 \
                requests==2.34.2
            displayName: Install bounded synthetic-audio runtime
          - task: AzureCLI@2
            displayName: Run Speech quality suite with resumable progress
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_enabled=$(az appconfig kv show \
                  --endpoint "$(qualificationAppConfigurationEndpoint)" \
                  --key "qualification/enabled" \
                  --auth-mode login \
                  --query value \
                  --output tsv \
                  --only-show-errors)
                if [ "$qualification_enabled" != "true" ]; then
                  echo "Qualification automation is disabled in App Configuration."
                  exit 2
                fi
                qualification_speech_result="$AGENT_TEMPDIRECTORY/speech-evaluation.json"
                set +e
                python scripts/run_speech_quality_evaluations.py \
                  --execute \
                  --endpoint "$(qualificationSpeechEndpoint)" \
                  --app-configuration-endpoint "$(qualificationAppConfigurationEndpoint)" \
                  > "$qualification_speech_result"
                qualification_speech_exit=$?
                set -e
                qualification_speech_summary="$AGENT_TEMPDIRECTORY/speech-evaluation.md"
                python - "$qualification_speech_result" "$qualification_speech_summary" <<'PY'
                import json
                import sys

                report = json.load(open(sys.argv[1], encoding="utf-8"))
                lines = [
                    "# Azure Speech daily synthetic regression",
                    "",
                    f"Mode: **{report['mode']}**",
                    f"Pre-recorded attempts: **{report.get('attempted_requests', 0)}/{report.get('planned_requests', 0)}**",
                    f"Completed profiles: **{report.get('completed_requests', 0)}/{report.get('planned_requests', 0)}**",
                    f"Unresolved attempts: **{report.get('unresolved_attempts', 0)}**",
                    f"Confirmed successful audio: **{report.get('audio_hours', 0):.4f} hours**",
                    f"Successful-audio promotional-rate estimate: **${report.get('estimated_cost_usd', 0):.4f}**",
                    f"Possible billed audio ceiling: **{report.get('possible_billed_audio_hours', 0):.4f} hours / promotional ${report.get('maximum_possible_cost_usd', 0):.4f}**",
                    f"Possible billed standard-rate ceiling: **${report.get('maximum_standard_rate_cost_usd', 0):.4f}**",
                    f"Spend target reached: **{'yes' if report.get('spend_target_reached') else 'no'}**",
                    f"Quality checks passed: **{'yes' if report.get('quality_checks_passed') else 'no'}**",
                    "",
                    "| Product | Capability | Profile | Sample WER | Term recall | Latency | Result |",
                    "|---|---|---|---:|---:|---:|:---:|",
                ]
                if report.get("stop_category"):
                    lines[3:3] = [f"Stop category: **{report['stop_category']}**"]
                for item in report.get("profile_results", []):
                    lines.append(
                        f"| {item['product']} | {item['capability']} | {item['profile']} | "
                        f"{item['sample_word_error_rate_milli'] / 10:.1f}% | "
                        f"{item['required_term_recall_milli'] / 10:.1f}% | "
                        f"{item['latency_milliseconds'] / 1000:.1f}s | "
                        f"{'Pass' if item['quality_passed'] else 'Review'} |"
                    )
                lines.extend(
                    [
                        "",
                        "Synthetic speech is a repeatable regression signal, not a human-usability study.",
                        "Audio, transcripts, credentials, identifiers, and provider payloads are not retained.",
                    ]
                )
                open(sys.argv[2], "w", encoding="utf-8").write("\n".join(lines) + "\n")
                PY
                echo "##vso[task.uploadsummary]$qualification_speech_summary"
                exit "$qualification_speech_exit"
            env:
              PEERSLATE_AZURE_QUALIFICATION_ACTIVATED: $(qualificationActivationEnabled)
              PEERSLATE_AZURE_CREDIT_CONFIRMED: $(qualificationCreditConfirmed)
              PEERSLATE_AZURE_SPEND_AUTHORIZATION_REF: $(qualificationSpeechAuthorizationRef)
