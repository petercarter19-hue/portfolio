# Active definition for PS-AZURE-STARTUP-ACTIVATION-001.
#
# The two daily schedules are deliberately redundant.  App Configuration holds
# a non-secret UTC success marker, so the second run spends nothing when the
# first Foundry run reached its reviewed fresh-input target.  The fallback can
# recover a transient early-day failure without relying on a person.
trigger: none
pr: none
lockBehavior: sequential

schedules:
  - cron: '20 1 * * *'
    displayName: Primary daily qualification run
    batch: true
    branches:
      include:
        - main
    always: true
  - cron: '20 13 * * *'
    displayName: Daily qualification recovery run
    batch: true
    branches:
      include:
        - main
    always: true

variables:
  vmImageName: 'ubuntu-latest'
  pythonVersion: '3.12'
  # This passwordless connection is dedicated to qualification.  It is not the
  # production deploy/migration connection in azure-pipelines.yml.
  qualificationServiceConnectionId: 'peerslate-startup-qualification-wif'
  qualificationActivationEnabled: 'true'
  qualificationCreditConfirmed: 'true'
  qualificationSpendAuthorizationRef: 'session:01a046b3-74fc-7903-a336-3f1647f81d1c/owner-authorization:2026-09-03/activate-five-azure-startup-services-and-continuous-tracking'
  # Use the data-plane endpoint so this identity needs no ARM Reader role just
  # to discover a store it already has exact App Configuration data access to.
  qualificationAppConfigurationEndpoint: 'https://peerslate-startup-qualification.azconfig.io'
  qualificationFoundryEndpoint: 'https://peerslate-foundry.openai.azure.com'
  qualificationFoundryDeployment: 'gpt-5.6-luna'
  # Nine distinct product-aligned cases run once: the call count and spend
  # envelope stay identical to the reviewed three-cases-times-three plan.
  qualificationEvaluationRepeats: '1'
  qualificationSyntheticContextRecords: '13000'
  qualificationMinimumFreshInputTokens: '2800000'
  qualificationMinimumInputTokensPerCall: '272001'
  qualificationMaximumInputTokens: '350000'
  qualificationMaximumInputBytes: '1800000'
  qualificationMaximumOutputTokens: '2000'
  qualificationMinimumCallIntervalSeconds: '65'
  qualificationFoundryHardCapUsd: '3.25'

stages:
  - stage: Inactive
    displayName: Confirm qualification automation is inactive
    condition: ne(variables['qualificationActivationEnabled'], 'true')
    jobs:
      - job: InactiveByDesign
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: none
          - script: |
              echo "Azure startup qualification automation is inactive by design."
              echo "No Azure query or paid model call was made."
            displayName: Report inactive state

  - stage: QualificationStatus
    displayName: Read five-workload continuity
    condition: >-
      and(
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpendAuthorizationRef'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: ReadOnlyCostStatus
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - task: AzureCLI@2
            displayName: Query privacy-safe Cost Management status
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_subscription_id=$(az account show --query id -o tsv)
                qualification_status_file="$AGENT_TEMPDIRECTORY/qualification-status.json"
                set +e
                python scripts/azure_startup_qualification_status.py \
                  --subscription-id "$qualification_subscription_id" \
                  --pretty \
                  --require-qualified-latest-day \
                  > "$qualification_status_file"
                qualification_status_exit=$?
                set -e
                qualification_summary_file="$AGENT_TEMPDIRECTORY/qualification-status.md"
                python - "$qualification_status_file" "$qualification_summary_file" <<'PY'
                import json
                import sys

                report = json.load(open(sys.argv[1], encoding="utf-8"))
                latest = report["latest_day"]
                if latest is None:
                    lines = [
                        "# Azure startup qualification status",
                        "",
                        "No complete UTC Cost Management day is available yet.",
                        "",
                        "This is a conservative Cost Management estimate. The Microsoft for Startups portal remains authoritative.",
                    ]
                    open(sys.argv[2], "w", encoding="utf-8").write("\n".join(lines) + "\n")
                    raise SystemExit(0)
                costs = latest["workload_cost_usd"]
                labels = {item["key"]: item["label"] for item in report["workloads"]}
                lines = [
                    "# Azure startup qualification status",
                    "",
                    f"Latest complete UTC day: **{latest['day']}**",
                    f"Five-service day qualified: **{'yes' if latest['qualifies'] else 'no'}**",
                    f"Current uninterrupted five-service streak: **{report['current_complete_day_streak']} days**",
                    "",
                    "| Workload | Cost | Above $1 |",
                    "|---|---:|:---:|",
                ]
                for key in sorted(labels):
                    value = costs.get(key, 0)
                    lines.append(
                        f"| {labels[key]} | ${value:.4f} | {'Yes' if value > 1 else 'No'} |"
                    )
                lines.extend(
                    [
                        "",
                        "This is a conservative Cost Management estimate. The Microsoft for Startups portal remains authoritative.",
                    ]
                )
                open(sys.argv[2], "w", encoding="utf-8").write("\n".join(lines) + "\n")
                PY
                echo "##vso[task.uploadsummary]$qualification_summary_file"
                exit "$qualification_status_exit"

  - stage: FoundryEvaluation
    displayName: Run bounded Luna evaluations
    dependsOn: QualificationStatus
    condition: >-
      and(
        always(),
        eq(variables['qualificationActivationEnabled'], 'true'),
        eq(variables['qualificationCreditConfirmed'], 'true'),
        ne(variables['qualificationSpendAuthorizationRef'], ''),
        ne(variables['qualificationFoundryEndpoint'], ''),
        ne(variables['qualificationServiceConnectionId'], '')
      )
    jobs:
      - job: BoundedFoundryEvaluation
        timeoutInMinutes: 30
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
          - task: AzureCLI@2
            displayName: Run structural evaluations under the hard dollar cap
            inputs:
              azureSubscription: $(qualificationServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                qualification_enabled=$(az appconfig kv show \
                  --endpoint "$(qualificationAppConfigurationEndpoint)" \
                  --key "qualification/enabled" \
                  --auth-mode login \
                  --query value \
                  --output tsv \
                  --only-show-errors)
                if [ "$qualification_enabled" != "true" ]; then
                  echo "Qualification automation is disabled in App Configuration."
                  exit 2
                fi
                qualification_today=$(date -u +%F)
                qualification_last_success=$(az appconfig kv show \
                  --endpoint "$(qualificationAppConfigurationEndpoint)" \
                  --key "qualification/foundry/last-success-day" \
                  --auth-mode login \
                  --query value \
                  --output tsv \
                  --only-show-errors)
                if [ "$qualification_last_success" = "$qualification_today" ]; then
                  echo "Foundry fresh-input target already reached for $qualification_today; no paid call is needed."
                  exit 0
                fi
                qualification_result_file="$AGENT_TEMPDIRECTORY/foundry-evaluation.json"
                set +e
                python scripts/run_foundry_luna_evaluations.py \
                  --execute \
                  --endpoint "$(qualificationFoundryEndpoint)" \
                  --deployment "$(qualificationFoundryDeployment)" \
                  --repeat "$(qualificationEvaluationRepeats)" \
                  --synthetic-context-records "$(qualificationSyntheticContextRecords)" \
                  --minimum-fresh-input-tokens "$(qualificationMinimumFreshInputTokens)" \
                  --minimum-input-tokens-per-call "$(qualificationMinimumInputTokensPerCall)" \
                  --maximum-input-tokens "$(qualificationMaximumInputTokens)" \
                  --maximum-input-bytes "$(qualificationMaximumInputBytes)" \
                  --maximum-output-tokens "$(qualificationMaximumOutputTokens)" \
                  --minimum-call-interval-seconds "$(qualificationMinimumCallIntervalSeconds)" \
                  --hard-cap-usd "$(qualificationFoundryHardCapUsd)" \
                  > "$qualification_result_file"
                qualification_runner_exit=$?
                set -e
                qualification_marker_eligible=$(python -c 'import json,sys; print(str(bool(json.load(open(sys.argv[1], encoding="utf-8")).get("success_marker_eligible"))).lower())' "$qualification_result_file")
                if [ "$qualification_marker_eligible" = "true" ]; then
                  az appconfig kv set \
                    --endpoint "$(qualificationAppConfigurationEndpoint)" \
                    --key "qualification/foundry/last-success-day" \
                    --value "$qualification_today" \
                    --auth-mode login \
                    --yes \
                    --output none \
                    --only-show-errors
                fi
                qualification_summary_file="$AGENT_TEMPDIRECTORY/foundry-evaluation.md"
                python - "$qualification_result_file" "$qualification_summary_file" <<'PY'
                import json
                import sys

                report = json.load(open(sys.argv[1], encoding="utf-8"))
                maximum_calls = report.get("maximum_calls", 0)
                passed = report.get("passed", 0)
                lines = [
                    "# Foundry Luna daily product-quality evaluation",
                    "",
                    f"Mode: **{report['mode']}**",
                    (
                        "Success marker eligible: **"
                        f"{'yes' if report.get('success_marker_eligible') else 'no'}**"
                    ),
                    (
                        "Fresh-input target reached: **"
                        f"{'yes' if report.get('fresh_input_target_reached') else 'no'}**"
                    ),
                    f"Automated quality checks passed: **{passed}/{maximum_calls}**",
                    (
                        "All automated quality checks passed: **"
                        f"{'yes' if report.get('quality_checks_passed') else 'no'}**"
                    ),
                    f"Calls billed: **{report.get('calls_billed', 0)}**",
                    f"Fresh input tokens: **{report.get('fresh_input_tokens', 0):,}**",
                    f"Cached input tokens: **{report.get('cached_input_tokens', 0):,}**",
                    f"Output tokens: **{report.get('output_tokens', 0):,}**",
                    f"Safety-schedule estimate: **${report.get('estimated_cost_usd', 0):.4f}**",
                    "",
                    "| Product | Capability | Benchmark | Result |",
                    "|---|---|---|---|",
                ]
                if report.get("stop_category"):
                    lines[3:3] = [
                        f"Stop category: **{report['stop_category']}**",
                    ]
                for item in report.get("case_results", []):
                    attempts = item.get("attempts", 0)
                    result = (
                        f"{item.get('passed', 0)}/{attempts} passed"
                        if attempts
                        else "not run"
                    )
                    lines.append(
                        f"| {item['product']} | {item['capability']} | "
                        f"{item['benchmark_ref']} | {result} |"
                    )
                failure_categories = report.get("failure_categories", {})
                if failure_categories:
                    lines.extend(["", "Failure categories:"])
                    lines.extend(
                        f"- {category}: {count}"
                        for category, count in sorted(failure_categories.items())
                    )
                lines.extend(
                    [
                        "",
                        (
                            "This is a synthetic foundation-level behavioral smoke "
                            "suite, not a human quality score or proof of production "
                            "prompt parity."
                        ),
                        "Prompts and model output are not retained in this report.",
                    ]
                )
                open(sys.argv[2], "w", encoding="utf-8").write("\n".join(lines) + "\n")
                PY
                echo "##vso[task.uploadsummary]$qualification_summary_file"
                exit "$qualification_runner_exit"
            env:
              PEERSLATE_AZURE_QUALIFICATION_ACTIVATED: $(qualificationActivationEnabled)
              PEERSLATE_AZURE_CREDIT_CONFIRMED: $(qualificationCreditConfirmed)
              PEERSLATE_AZURE_SPEND_AUTHORIZATION_REF: $(qualificationSpendAuthorizationRef)
