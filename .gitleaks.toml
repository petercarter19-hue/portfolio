title = "PeerSlate Gitleaks configuration"

# Allowlists here are scoped by rule, exact path, and exact line pattern. They
# are deliberately NOT pinned to commit SHAs.
#
# They used to be. On 2026-08-04 the Community pull request was squash-merged,
# which rewrites every branch commit into one new SHA, and three commit-pinned
# allowlists stopped matching at once: the two false positives they covered
# reappeared as leaks and the deploy for the merge commit failed. Production was
# unaffected -- it kept serving the previous build -- but main could not deploy
# until the pins were removed.
#
# A commit-pinned allowlist cannot survive the repository's own required merge
# strategy, so pinning guarantees a broken deploy on the merge that carries the
# allowlisted line. Rule + path + exact line is tight enough: each entry below
# suppresses one known-safe line in one known file, and any other line in that
# file, or that line moved to another file, still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Known non-secret member UUID used only as a deterministic test fixture."
targetRules = ["generic-api-key"]
regexes = [
  '''^45ab728a-44bc-4f80-a79f-d010e04d5453$''',
]

[[allowlists]]
description = """Known non-secret Community cursor max_age keyword argument. \
`CURSOR_MAX_AGE_SECONDS` is an integer expiry window passed to \
itsdangerous; generic-api-key matches the shape of the assignment, not a \
credential."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^services/community_cursor\.py$''']
regexTarget = "line"
regexes = ['''^\s*token,\s+max_age=CURSOR_MAX_AGE_SECONDS\s*$''']

[[allowlists]]
description = """Known non-secret Community evidence prose. A sentence \
describing audio handling, matched only for its shape."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/initiatives/PS-COMMUNITY-PUBLIC-PILOT-001/PRIMARY_FEED_ARCHITECTURE_AMENDMENT_2026-08-01\.md$''']
regexTarget = "line"
regexes = ['''^\s*server audio, no content-bearing logs, owner-only access, size/duration and\s*$''']
