title = "PeerSlate Gitleaks configuration"

# Allowlists here are scoped by rule, exact path, and exact line pattern. They
# are deliberately NOT pinned to commit SHAs.
#
# They used to be. On 2026-08-04 the Community pull request was squash-merged,
# which rewrites every branch commit into one new SHA, and three commit-pinned
# allowlists stopped matching at once: the two false positives they covered
# reappeared as leaks and the deploy for the merge commit failed. Production was
# unaffected -- it kept serving the previous build -- but main could not deploy
# until the pins were removed.
#
# A commit-pinned allowlist cannot survive the repository's own required merge
# strategy, so pinning guarantees a broken deploy on the merge that carries the
# allowlisted line. Rule + path + exact line is tight enough: each entry below
# suppresses one known-safe line in one known file, and any other line in that
# file, or that line moved to another file, still fails the scan.

[extend]
useDefault = true

[[allowlists]]
description = "Known non-secret member UUID used only as a deterministic test fixture."
targetRules = ["generic-api-key"]
regexes = [
  '''^45ab728a-44bc-4f80-a79f-d010e04d5453$''',
]

[[allowlists]]
description = """Known non-secret Community cursor max_age keyword argument. \
`CURSOR_MAX_AGE_SECONDS` is an integer expiry window passed to \
itsdangerous; generic-api-key matches the shape of the assignment, not a \
credential."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^services/community_cursor\.py$''']
regexTarget = "line"
regexes = ['''^\s*token,\s+max_age=CURSOR_MAX_AGE_SECONDS\s*$''']

# The two entries below use character classes where the fixture identifier
# would otherwise appear verbatim. That is not decoration: a pattern written
# out in full would itself be a key-shaped assignment on this line, and this
# file is scanned too -- writing the allowlist would create the very finding
# it suppresses. The class breaks the run of value characters, so the rule no
# longer matches here while still matching the fixture line exactly.

[[allowlists]]
description = """Known non-secret Profile relationship test fixtures: keyword \
arguments assigned literal fixture identifiers, which match generic-api-key \
on the SHAPE of a key assignment rather than on any credential. These lines \
live only in repository history -- the file is no longer on main -- and the \
pipeline runs `gitleaks git .` over full history, so deleting the file did \
not and cannot clear the finding; only this allowlist can."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/test_profile_relationships\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*actor_key="viewer[A-Za-z]+_123", subject_owner_key="owner[A-Za-z]+_456"\).*$''',
  '''^\s*actor_key=None, subject_owner_key="owner[A-Za-z]+_456"\)\s*$''',
]

[[allowlists]]
description = """Known non-secret Profile voice-projection test fixtures: the \
same key-shaped keyword arguments assigned literal fixture identifiers. \
History-only, as above."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/test_profile_voice_projection\.py$''']
regexTarget = "line"
regexes = ['''^\s*owner_key="owner[A-Za-z]+_123", projection_key="voice[A-Za-z]+_123",\s*$''']

[[allowlists]]
description = """Known non-secret Community evidence prose. A sentence \
describing audio handling, matched only for its shape."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/initiatives/PS-COMMUNITY-PUBLIC-PILOT-001/PRIMARY_FEED_ARCHITECTURE_AMENDMENT_2026-08-01\.md$''']
regexTarget = "line"
regexes = ['''^\s*server audio, no content-bearing logs, owner-only access, size/duration and\s*$''']

[[allowlists]]
description = """Known non-secret Search 3F proof-manifest identifiers. The \
manifest is a deterministic synthetic fixture, and these two fields identify \
fixture publication revisions and projections rather than credentials. The \
pipeline scans every fetched Git ref, so the frozen review branch remains in \
scope even though this fixture is not on main."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/initiatives/PS-SEARCH-DARK-PROOF-001/fixtures/public-content-proof-manifest\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"publication_revision_[k]ey": "rev_(?:alder-quist|ben-okafor|mira-ostrand)_001",\s*$''',
  '''^\s*"projection_[k]ey": "proj_(?:alder-quist|ben-okafor|mira-ostrand)_(?:experience|skill)_[0-9]{3}",\s*$''',
]

[[allowlists]]
description = """Known non-secret Azure startup-qualification Luna evaluation \
fixtures. Each value is a deterministic synthetic evaluation-case revision \
label, not a credential: generic-api-key matches the SHAPE of a key-suffixed \
JSON field, exactly as it does for the Profile and Search fixtures above. \
These lines entered history on the package work branch and the pipeline runs \
`gitleaks git .` over every fetched ref, so editing or deleting the fixture \
cannot clear the finding -- only this allowlist can, and until it exists the \
gate fails on every branch including main."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/fixtures/azure_startup_qualification/luna_eval_cases\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"source_version_[k]ey": "synthetic-(?:accessibility|delivery|product)-v1",\s*$''',
]

[[allowlists]]
description = """Known non-secret My Opportunities qualification test \
fixtures: literal idempotency and entity keys passed as keyword arguments in \
service-call assertions. generic-api-key matches the SHAPE of a `..._key=` \
assignment, not any credential -- the values are fixture labels such as \
member ids and retry tokens. These lines entered history on the package work \
branch, and because the pipeline scans every fetched ref they cannot be \
cleared by editing or reverting the file; only this allowlist clears them. \
Scoped to this one path and this one call shape, so any other line in the \
file, or this shape in another file, still fails the scan. The trailing \
`now=` value deliberately excludes quote characters: an earlier draft ended \
`now=.*$`, which independent review proved would admit a real quoted \
credential appended after now=, or supplied as the now= value itself."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/test_my_opportunities_qualification\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*(?:service\.[a-z_]+\()?"member-[ab]", (?:grant|observation)_[k]ey=[A-Za-z_][A-Za-z0-9_.]*, idempotency_[k]ey="[a-z0-9-]+", now=[^"']*$''',
]

[[allowlists]]
description = """Known non-secret My Opportunities retrieval test fixtures: \
the same key-shaped service-call idiom as the qualification suite above, in \
the retrieval suite's own file with its own actor literals. The value is a \
fixture retry token, not a credential. Same reasoning as the entry above: \
the line lives in branch history, the pipeline scans every fetched ref, and \
only this allowlist can clear it."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/test_my_opportunities_retrieval\.py$''']
regexTarget = "line"
regexes = [
  '''^\s*(?:service\.[a-z_]+\()?"(?:alice|bob)", (?:grant|observation)_[k]ey=[A-Za-z_][A-Za-z0-9_.]*, idempotency_[k]ey="[a-z0-9-]+", now=[^"']*$''',
]
