# PeerSlate Azure DevOps deployment pipeline.
# GitHub Actions are disabled; Azure DevOps deploys approved `main` changes.
trigger:
  batch: true
  branches:
    include:
      - main

parameters:
  - name: forceProductionDeploy
    displayName: Force production deploy for a manually queued main run
    type: boolean
    default: false

variables:
  # Created in Azure DevOps while configuring the Azure Web App connection.
  azureServiceConnectionId: '3ee022e1-c929-4693-95bd-211db6076ff0'
  webAppName: 'peerslate-pete'
  candidateWebAppName: 'peerslate-candidate'
  vmImageName: 'ubuntu-latest'
  environmentName: 'peerslate-pete'
  candidateEnvironmentName: 'peerslate-candidate'
  # Queue-time Candidate admission is fail-closed. Azure pipeline metadata
  # defines candidatePackage, candidateSourceBranch, and
  # candidateSourceVersion as empty-by-default and queue-overridable. Do not
  # redeclare them here: a YAML value would shadow the reviewed queue values.
  # The build manifest verifies that all three exactly match the source Azure
  # actually checked out.
  pythonVersion: '3.12'
  productionBaseUrl: 'https://peerslate.com'
  candidateBaseUrl: 'https://peerslate-candidate.azurewebsites.net'
  pipAuditVersion: '2.10.1'
  gitleaksVersion: '8.30.1'
  gitleaksLinuxX64Sha256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install requirements

          - script: python -m pip check
            displayName: Verify dependency compatibility

          - script: |
              set -euo pipefail
              scanner="$(Agent.TempDirectory)/pip-audit"
              python -m venv "$scanner"
              "$scanner/bin/python" -m pip install --quiet "pip-audit==$(pipAuditVersion)"
              mkdir -p "$(Build.ArtifactStagingDirectory)/evidence"
              "$scanner/bin/python" -m pip_audit \
                --requirement requirements.txt \
                --strict \
                --progress-spinner off \
                --format json \
                --output "$(Build.ArtifactStagingDirectory)/evidence/pip-audit.json"
            displayName: Scan dependencies for known vulnerabilities

          - script: |
              set -euo pipefail
              scanner_dir="$(Agent.TempDirectory)/gitleaks"
              archive="$scanner_dir/gitleaks.tar.gz"
              mkdir -p "$scanner_dir" "$(Build.ArtifactStagingDirectory)/evidence"
              curl --fail --silent --show-error --location \
                --output "$archive" \
                "https://github.com/gitleaks/gitleaks/releases/download/v$(gitleaksVersion)/gitleaks_$(gitleaksVersion)_linux_x64.tar.gz"
              printf '%s  %s\n' "$(gitleaksLinuxX64Sha256)" "$archive" \
                | sha256sum --check -
              tar -xzf "$archive" -C "$scanner_dir" gitleaks
              "$scanner_dir/gitleaks" git . \
                --config .gitleaks.toml \
                --redact=100 \
                --report-format json \
                --report-path "$(Build.ArtifactStagingDirectory)/evidence/gitleaks.json" \
                --exit-code 1
            displayName: Scan full repository history for secrets

          - script: >-
              python -m compileall -q
              app.py auth_routes.py owner_routes.py peerslate_api.py
              people_interests_api.py services scripts
            displayName: Compile runtime and operational scripts

          - script: python -m unittest discover -s tests -q
            displayName: Run application and security tests
            env:
              ANTHROPIC_API_KEY: test-key-for-ci-only

          - script: python scripts/generate_control_room_snapshot.py
            displayName: Generate Control Room snapshot
            env:
              BUILD_BUILDID: $(Build.BuildId)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)

          - script: >-
              python scripts/release_identity.py
              --source-version "$(Build.SourceVersion)"
              --build-id "$(Build.BuildId)"
            displayName: Generate immutable release identity

          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              # Ship only what the running site needs. Every exclusion below
              # was verified to have no runtime reader before being added.
              #
              # KEEP, despite being large or looking inert:
              #   docs/**       control_room_projection.py reads
              #                 docs/governance/ and docs/initiatives/ live to
              #                 build the Control Room, and app.py loads
              #                 docs/knowledge/ at startup for the chatbot.
              #   SQL FIles/**  small, and the migration tooling resolves it
              #                 by that exact (misspelled) path.
              #   static/images/Mockups/**, static/images/background-templates/**
              #                 partly live: resume2.css references
              #                 Mockups/resume2/, and three stylesheets
              #                 reference background-templates. Do not exclude
              #                 these wholesale.
              Contents: |
                **/*
                !.git/**
                !antenv/**
                !artifacts/**
                !tests/**
                !Design ideas/**
                !static/Background/**
                !static/Mockup/**
                !PeerSlate_Company_and_Product_Bible_v1.*.docx
                !.github/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/app'
            displayName: Prepare deployment package

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: Archive deployment package

          - script: >-
              python scripts/candidate_artifact.py
              --archive "$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip"
              --output "$(Build.ArtifactStagingDirectory)/drop/candidate-manifest.json"
              --source-version "$(Build.SourceVersion)"
              --source-branch "$(Build.SourceBranch)"
              --build-id "$(Build.BuildId)"
              --python-version "$(pythonVersion)"
              --candidate-package "$CANDIDATE_PACKAGE"
              --candidate-source-branch "$CANDIDATE_SOURCE_BRANCH"
              --candidate-source-version "$CANDIDATE_SOURCE_VERSION"
            displayName: Record immutable candidate artifact hash
            env:
              # Queue values enter the process as data, never as Bash source.
              # candidate_artifact.py performs the format and exact-match
              # validation before any Candidate stage may run.
              CANDIDATE_PACKAGE: $(candidatePackage)
              CANDIDATE_SOURCE_BRANCH: $(candidateSourceBranch)
              CANDIDATE_SOURCE_VERSION: $(candidateSourceVersion)

          - upload: '$(Build.ArtifactStagingDirectory)/drop'
            artifact: drop
            displayName: Upload immutable deployment package

          - upload: '$(Build.ArtifactStagingDirectory)/evidence'
            artifact: CandidateEvidence
            displayName: Upload redacted scanner evidence

  - stage: ProductionRelease
    displayName: Deploy and verify production
    dependsOn: Build
    # Main is cumulative, so only the latest waiting release should proceed.
    # Keeping deploy and smoke in this one locked stage prevents a later run
    # from replacing the artifact before the current run verifies its identity.
    lockBehavior: runLatest
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        or(
          ne(variables['Build.Reason'], 'Manual'),
          ${{ eq(parameters.forceProductionDeploy, true) }}
        )
      )
    jobs:
      - deployment: DeployWebApp
        environment: $(environmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                  clean: true

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: Use Python $(pythonVersion)

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(webAppName)

                - script: >-
                    python scripts/verify_deployment_smoke.py
                    --base-url "$(productionBaseUrl)"
                    --expected-source-version "$(Build.SourceVersion)"
                    --expected-build-id "$(Build.BuildId)"
                    --warmup-seconds 180
                    --retry-delay 10
                    --timeout 15
                  displayName: Verify liveness and canonical public routes

  - stage: CandidateDeploy
    displayName: Deploy isolated candidate
    dependsOn: Build
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - deployment: DeployCandidateWebApp
        environment: $(candidateEnvironmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: >-
                      az webapp start
                      --resource-group peerslate
                      --name "$(candidateWebAppName)"
                  displayName: Start isolated candidate

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(candidateWebAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(candidateWebAppName)

  - stage: CandidateSmoke
    displayName: Verify isolated candidate
    dependsOn: CandidateDeploy
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: CandidatePublicBoundarySmoke
        displayName: Candidate boundary smoke
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: >-
              python scripts/verify_deployment_smoke.py
              --base-url "$(candidateBaseUrl)"
              --expected-source-version "$(Build.SourceVersion)"
              --expected-build-id "$(Build.BuildId)"
              --warmup-seconds 180
              --retry-delay 10
              --timeout 15
            displayName: Verify candidate identity and public boundary

  - stage: CandidateStop
    displayName: Exercise and enforce candidate stop
    dependsOn: CandidateSmoke
    condition: >-
      and(
        always(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: StopCandidateWebApp
        displayName: Stop isolated candidate
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp stop \
                  --resource-group peerslate \
                  --name "$(candidateWebAppName)"
                state="$(
                  az webapp show \
                    --resource-group peerslate \
                    --name "$(candidateWebAppName)" \
                    --query state \
                    --output tsv
                )"
                test "$state" = "Stopped"
                echo "Candidate stop action passed; state=$state"
            displayName: Stop candidate and verify Azure state
