# PeerSlate Azure DevOps deployment pipeline.
# GitHub Actions are disabled; Azure DevOps deploys approved `main` changes.
trigger:
  batch: true
  branches:
    include:
      - main

parameters:
  - name: forceProductionDeploy
    displayName: Force production deploy for a manually queued main run
    type: boolean
    default: false

  # Schema never moves because a pull request merged. It moves because a person
  # queued this pipeline, chose an action other than `none`, and an approver
  # released the `peerslate-database-schema` environment. Merging a migration
  # file changes nothing in any database.
  - name: schemaAction
    displayName: Database schema action (governed migration path)
    type: string
    default: none
    values:
      - none
      - report
      - apply
      - rollback
  - name: schemaMigrationId
    displayName: Schema migration id (apply expectation, or the id to roll back)
    type: string
    default: ''
  - name: schemaRollbackConfirm
    displayName: Rollback confirmation (retype the migration id exactly)
    type: string
    default: ''

variables:
  # Created in Azure DevOps while configuring the Azure Web App connection.
  azureServiceConnectionId: '3ee022e1-c929-4693-95bd-211db6076ff0'
  webAppName: 'peerslate-pete'
  candidateWebAppName: 'peerslate-candidate'
  vmImageName: 'ubuntu-latest'
  environmentName: 'peerslate-pete'
  candidateEnvironmentName: 'peerslate-candidate'
  # Queue-time Candidate admission is fail-closed. Azure pipeline metadata
  # defines candidatePackage, candidateSourceBranch, and
  # candidateSourceVersion as empty-by-default and queue-overridable. Do not
  # redeclare them here: a YAML value would shadow the reviewed queue values.
  # The build manifest verifies that all three exactly match the source Azure
  # actually checked out.
  pythonVersion: '3.12'
  # The only database the SchemaMigration stage may touch. The script confirms
  # it against DB_NAME() on the open connection before it reads or writes
  # anything, so a stale or mistyped secret fails closed instead of applying
  # somewhere unintended.
  schemaDatabaseName: 'peerslate-database'
  productionBaseUrl: 'https://peerslate.com'
  candidateBaseUrl: 'https://peerslate-candidate.azurewebsites.net'
  pipAuditVersion: '2.10.1'
  gitleaksVersion: '8.30.1'
  gitleaksLinuxX64Sha256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install requirements

          - script: python -m pip check
            displayName: Verify dependency compatibility

          - script: |
              set -euo pipefail
              scanner="$(Agent.TempDirectory)/pip-audit"
              python -m venv "$scanner"
              "$scanner/bin/python" -m pip install --quiet "pip-audit==$(pipAuditVersion)"
              mkdir -p "$(Build.ArtifactStagingDirectory)/evidence"
              "$scanner/bin/python" -m pip_audit \
                --requirement requirements.txt \
                --strict \
                --progress-spinner off \
                --format json \
                --output "$(Build.ArtifactStagingDirectory)/evidence/pip-audit.json"
            displayName: Scan dependencies for known vulnerabilities

          - script: |
              set -euo pipefail
              scanner_dir="$(Agent.TempDirectory)/gitleaks"
              archive="$scanner_dir/gitleaks.tar.gz"
              mkdir -p "$scanner_dir" "$(Build.ArtifactStagingDirectory)/evidence"
              curl --fail --silent --show-error --location \
                --output "$archive" \
                "https://github.com/gitleaks/gitleaks/releases/download/v$(gitleaksVersion)/gitleaks_$(gitleaksVersion)_linux_x64.tar.gz"
              printf '%s  %s\n' "$(gitleaksLinuxX64Sha256)" "$archive" \
                | sha256sum --check -
              tar -xzf "$archive" -C "$scanner_dir" gitleaks
              "$scanner_dir/gitleaks" git . \
                --config .gitleaks.toml \
                --redact=100 \
                --report-format json \
                --report-path "$(Build.ArtifactStagingDirectory)/evidence/gitleaks.json" \
                --exit-code 1
            displayName: Scan full repository history for secrets

          - script: >-
              python -m compileall -q
              app.py auth_routes.py owner_routes.py peerslate_api.py
              people_interests_api.py services scripts
            displayName: Compile runtime and operational scripts

          - script: python -m unittest discover -s tests -q
            displayName: Run application and security tests
            env:
              ANTHROPIC_API_KEY: test-key-for-ci-only

          - script: python scripts/generate_control_room_snapshot.py
            displayName: Generate Control Room snapshot
            env:
              BUILD_BUILDID: $(Build.BuildId)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)

          - script: >-
              python scripts/release_identity.py
              --source-version "$(Build.SourceVersion)"
              --build-id "$(Build.BuildId)"
            displayName: Generate immutable release identity

          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              # Ship only what the running site needs. Every exclusion below
              # was verified to have no runtime reader before being added.
              #
              # KEEP, despite being large or looking inert:
              #   docs/**       control_room_projection.py reads
              #                 docs/governance/ and docs/initiatives/ live to
              #                 build the Control Room, and app.py loads
              #                 docs/knowledge/ at startup for the chatbot.
              #   SQL FIles/**  small, and the migration tooling resolves it
              #                 by that exact (misspelled) path.
              #   static/images/Mockups/**, static/images/background-templates/**
              #                 partly live: resume2.css references
              #                 Mockups/resume2/, and three stylesheets
              #                 reference background-templates. Do not exclude
              #                 these wholesale.
              Contents: |
                **/*
                !.git/**
                !antenv/**
                !artifacts/**
                !tests/**
                !Design ideas/**
                !static/Background/**
                !static/Mockup/**
                !PeerSlate_Company_and_Product_Bible_v1.*.docx
                !.github/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/app'
            displayName: Prepare deployment package

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: Archive deployment package

          - script: >-
              python scripts/candidate_artifact.py
              --archive "$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip"
              --output "$(Build.ArtifactStagingDirectory)/drop/candidate-manifest.json"
              --source-version "$(Build.SourceVersion)"
              --source-branch "$(Build.SourceBranch)"
              --build-id "$(Build.BuildId)"
              --python-version "$(pythonVersion)"
              --candidate-package "$CANDIDATE_PACKAGE"
              --candidate-source-branch "$CANDIDATE_SOURCE_BRANCH"
              --candidate-source-version "$CANDIDATE_SOURCE_VERSION"
            displayName: Record immutable candidate artifact hash
            env:
              # Queue values enter the process as data, never as Bash source.
              # candidate_artifact.py performs the format and exact-match
              # validation before any Candidate stage may run.
              CANDIDATE_PACKAGE: $(candidatePackage)
              CANDIDATE_SOURCE_BRANCH: $(candidateSourceBranch)
              CANDIDATE_SOURCE_VERSION: $(candidateSourceVersion)

          - upload: '$(Build.ArtifactStagingDirectory)/drop'
            artifact: drop
            displayName: Upload immutable deployment package

          - upload: '$(Build.ArtifactStagingDirectory)/evidence'
            artifact: CandidateEvidence
            displayName: Upload redacted scanner evidence

  - stage: ProductionRelease
    displayName: Deploy and verify production
    dependsOn: Build
    # Main is cumulative, so only the latest waiting release should proceed.
    # Keeping deploy and smoke in this one locked stage prevents a later run
    # from replacing the artifact before the current run verifies its identity.
    lockBehavior: runLatest
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        or(
          ne(variables['Build.Reason'], 'Manual'),
          ${{ eq(parameters.forceProductionDeploy, true) }}
        )
      )
    jobs:
      - deployment: DeployWebApp
        environment: $(environmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                  clean: true

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: Use Python $(pythonVersion)

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(webAppName)

                - script: >-
                    python scripts/verify_deployment_smoke.py
                    --base-url "$(productionBaseUrl)"
                    --expected-source-version "$(Build.SourceVersion)"
                    --expected-build-id "$(Build.BuildId)"
                    --warmup-seconds 420
                    --retry-delay 10
                    --timeout 15
                  displayName: Verify liveness and canonical public routes

  # A main run that builds but does not deploy must never read as a plain
  # success. Build 438 (2026-08-04) was queued manually, skipped
  # ProductionRelease on the condition above, reported `succeeded`, and was
  # reasonably mistaken for a release; production stayed on the previous
  # commit. This stage fires only in that exact case and downgrades the run to
  # `succeededWithIssues` so both a human and `az pipelines runs list` can see
  # that nothing shipped.
  - stage: ProductionReleaseSkipped
    displayName: Report that production was not deployed
    dependsOn: Build
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.Reason'], 'Manual'),
        ${{ eq(parameters.forceProductionDeploy, false) }}
      )
    jobs:
      - job: AnnounceSkippedProductionRelease
        displayName: Announce skipped production release
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: none

          - script: |
              set -euo pipefail
              echo "This manually queued main run built $BUILT_SOURCE_VERSION"
              echo "but did NOT deploy it. ProductionRelease is skipped for a"
              echo "Manual run unless forceProductionDeploy is true."
              echo ""
              echo "Production is still running whatever the last automatic"
              echo "run deployed. Confirm with /healthz before reporting any"
              echo "change as live."
              echo ""
              echo "If an automatic run for this same commit is already active,"
              echo "let it finish -- do not queue a manual fallback alongside"
              echo "it. Only re-queue with forceProductionDeploy=true when no"
              echo "automatic run will cover this commit."
              echo "##vso[task.logissue type=warning]Built $BUILT_SOURCE_VERSION without deploying: manual main run, forceProductionDeploy=false. Production was NOT updated."
              echo "##vso[task.complete result=SucceededWithIssues;]"
            displayName: Warn that no production deployment occurred
            env:
              # Same discipline as the Build stage: the SHA enters the process
              # as data, never as Bash source.
              BUILT_SOURCE_VERSION: $(Build.SourceVersion)

  # The governed database migration path. Application code and database schema
  # are released by separate, deliberate operations: this stage never deploys
  # the web app, and ProductionRelease never touches a database. A schema-only
  # run is therefore a manual main run that does not deploy, so
  # ProductionReleaseSkipped correctly warns that production code is unchanged.
  # That warning is true and useful here -- read the stage results, not the run
  # icon, to see what actually happened.
  #
  # Requires three one-time controls outside this file:
  #   * the `peerslate-database-schema` environment, with an approval check.
  #     Until that approval exists, the queue-time parameter is the only gate.
  #   * a secret pipeline variable `schemaConnectionString` holding the target
  #     connection string. Like the Candidate queue values it is defined in
  #     Azure pipeline metadata, never in this YAML, and it reaches the script
  #     as process environment data rather than as Bash source.
  #   * a contained Azure SQL user mapped to the service connection's client
  #     id, with only the documented schema-runner permissions. Azure RBAC does
  #     not by itself grant access to the SQL data plane.
  - stage: SchemaMigration
    displayName: Apply governed database schema migrations
    dependsOn: Build
    # Schema is not cumulative the way a deployment artifact is: a queued run
    # must never be dropped in favour of a later one, so this serializes rather
    # than running latest.
    lockBehavior: sequential
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ${{ ne(parameters.schemaAction, 'none') }}
      )
    jobs:
      - deployment: GovernedSchemaMigration
        environment: peerslate-database-schema
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                  clean: true

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: Use Python $(pythonVersion)

                - script: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                  displayName: Install requirements

                # Offline and fail-closed. Validates registry order, that every
                # registered file exists, and that every gate proof still
                # matches the T-SQL on this commit. Nothing connects until this
                # passes.
                - script: python scripts/govern_sql_migrations.py check
                  displayName: Validate the migration registry and gate proofs

                - ${{ if eq(parameters.schemaAction, 'report') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: >-
                          python scripts/govern_sql_migrations.py
                          --azure-pipelines
                          --emit-evidence "$(Build.ArtifactStagingDirectory)/schema/report.json"
                          --print-state
                          report
                          --expect-database "$(schemaDatabaseName)"
                          --write-state
                      displayName: Read the ledger and render the repository record
                      env:
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                - ${{ if eq(parameters.schemaAction, 'apply') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          arguments=(
                            scripts/govern_sql_migrations.py
                            --azure-pipelines
                            --emit-evidence
                            "$(Build.ArtifactStagingDirectory)/schema/apply.json"
                            --print-state
                            apply
                            --expect-database "$(schemaDatabaseName)"
                            --write-state
                          )
                          # Naming the migration is optional but strongly
                          # preferred: it makes the applier compare the operator's
                          # expectation with the plan the ledger produces, and
                          # refuse when they differ.
                          if [ -n "$SCHEMA_MIGRATION_ID" ]; then
                            arguments+=(--expect "$SCHEMA_MIGRATION_ID")
                          fi
                          python "${arguments[@]}"
                      displayName: Apply every pending gated migration
                      env:
                        # Queue values enter the process as data, never as Bash
                        # source -- the same discipline the Build stage uses for
                        # the Candidate admission values.
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                - ${{ if eq(parameters.schemaAction, 'rollback') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          # Two independently typed queue values must agree. The
                          # script checks it too; failing here first keeps a
                          # destructive run from opening a connection at all.
                          python scripts/govern_sql_migrations.py \
                            --azure-pipelines \
                            --emit-evidence \
                            "$(Build.ArtifactStagingDirectory)/schema/rollback.json" \
                            --print-state \
                            rollback "$SCHEMA_MIGRATION_ID" \
                            --confirm "$SCHEMA_ROLLBACK_CONFIRM" \
                            --expect-database "$(schemaDatabaseName)" \
                            --write-state
                      displayName: Roll back the most recently applied migration
                      env:
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
                        SCHEMA_ROLLBACK_CONFIRM: ${{ parameters.schemaRollbackConfirm }}
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                # The rendered record is the thing an operator commits, so it
                # must survive the agent. The evidence JSON is scrubbed of
                # credential-shaped text by the script before it is written.
                - script: |
                    set -euo pipefail
                    mkdir -p "$(Build.ArtifactStagingDirectory)/schema"
                    if [ -f docs/governance/PRODUCTION_SCHEMA_STATE.md ]; then
                      cp docs/governance/PRODUCTION_SCHEMA_STATE.md \
                        "$(Build.ArtifactStagingDirectory)/schema/"
                    fi
                  condition: always()
                  displayName: Stage the regenerated repository record

                - publish: '$(Build.ArtifactStagingDirectory)/schema'
                  artifact: SchemaMigrationEvidence
                  condition: always()
                  displayName: Publish schema migration evidence

  - stage: CandidateDeploy
    displayName: Deploy isolated candidate
    dependsOn: Build
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - deployment: DeployCandidateWebApp
        environment: $(candidateEnvironmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: >-
                      az webapp start
                      --resource-group peerslate
                      --name "$(candidateWebAppName)"
                  displayName: Start isolated candidate

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(candidateWebAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(candidateWebAppName)

  - stage: CandidateSmoke
    displayName: Verify isolated candidate
    dependsOn: CandidateDeploy
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: CandidatePublicBoundarySmoke
        displayName: Candidate boundary smoke
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: >-
              python scripts/verify_deployment_smoke.py
              --base-url "$(candidateBaseUrl)"
              --expected-source-version "$(Build.SourceVersion)"
              --expected-build-id "$(Build.BuildId)"
              --warmup-seconds 180
              --retry-delay 10
              --timeout 15
            displayName: Verify candidate identity and public boundary

  - stage: CandidateStop
    displayName: Exercise and enforce candidate stop
    dependsOn: CandidateSmoke
    condition: >-
      and(
        always(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: StopCandidateWebApp
        displayName: Stop isolated candidate
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp stop \
                  --resource-group peerslate \
                  --name "$(candidateWebAppName)"
                state="$(
                  az webapp show \
                    --resource-group peerslate \
                    --name "$(candidateWebAppName)" \
                    --query state \
                    --output tsv
                )"
                test "$state" = "Stopped"
                echo "Candidate stop action passed; state=$state"
            displayName: Stop candidate and verify Azure state
