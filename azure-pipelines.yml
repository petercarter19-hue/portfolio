# PeerSlate Azure DevOps deployment pipeline.
# GitHub Actions are disabled; Azure DevOps validates `main` changes. Production
# deployment is a separate manually authorized exact-SHA operation.
trigger:
  batch: true
  branches:
    include:
      - main

# Community retention obligations are independent of Community visibility.
# This schedule uses a dedicated workload identity with only five SQL procedure
# grants and one private-container Blob data role. Its nonsecret service
# connection and ActiveDirectoryDefault SQL connection are Azure pipeline
# metadata. Scheduled runs skip the ordinary Build/deploy/schema/Candidate path
# below and execute only the separately default-off maintenance stage.
schedules:
  - cron: '17 * * * *'
    displayName: Community maintenance hourly
    branches:
      include:
        - main
    always: true
    batch: true
  # PS-INTERVIEW-AI-EXTRACT-001: the Interview telemetry 90-day retention
  # purge. Isolated from Community maintenance by schedule display name
  # (both schedule-gated stages check Build.CronSchedule.DisplayName) and
  # by its own default-off enablement variable; this schedule triggers
  # nothing operative until interviewTelemetryMaintenanceEnabled is set
  # true AND the telemetry migration has actually been applied.
  - cron: '41 2 * * *'
    displayName: Interview telemetry retention nightly
    branches:
      include:
        - main
    always: true
    batch: true

parameters:
  # Repository delivery and production delivery are separate. PR and automatic
  # main runs build and test only. A web deployment requires all three manual
  # values below, including Pete's explicit authorization reference.
  - name: forceProductionDeploy
    displayName: Authorize a production deploy for this manual main run
    type: boolean
    default: false

  - name: manualProductionSourceVersion
    displayName: Exact 40-character main SHA to deploy
    type: string
    default: ''

  - name: productionAuthorizationReference
    displayName: Reference to Pete's explicit authorization for this deployment
    type: string
    default: ''

  # Schema never moves because a pull request merged. It moves because a person
  # queued this pipeline, chose an action other than `none`, and an approver
  # released the `peerslate-database-schema` environment. Merging a migration
  # file changes nothing in any database.
  - name: schemaAction
    displayName: Database schema action (governed migration path)
    type: string
    default: none
    values:
      - none
      - report
      - apply
      - rollback
  - name: schemaMigrationId
    displayName: Schema migration id (apply expectation, or the id to roll back)
    type: string
    default: ''
  - name: schemaRollbackConfirm
    displayName: Rollback confirmation (retype the migration id exactly)
    type: string
    default: ''

variables:
  # Created in Azure DevOps while configuring the Azure Web App connection.
  azureServiceConnectionId: '3ee022e1-c929-4693-95bd-211db6076ff0'
  webAppName: 'peerslate-pete'
  candidateWebAppName: 'peerslate-candidate'
  vmImageName: 'ubuntu-latest'
  environmentName: 'peerslate-pete'
  candidateEnvironmentName: 'peerslate-candidate'
  # Queue-time Candidate admission is fail-closed. Azure pipeline metadata
  # defines candidatePackage, candidateSourceBranch, and
  # candidateSourceVersion as empty-by-default and queue-overridable. Do not
  # redeclare them here: a YAML value would shadow the reviewed queue values.
  # The build manifest verifies that all three exactly match the source Azure
  # actually checked out.
  pythonVersion: '3.12'
  # The only database the schema operation may touch. The script confirms
  # it against DB_NAME() on the open connection before it reads or writes
  # anything, so a stale or mistyped secret fails closed instead of applying
  # somewhere unintended.
  schemaDatabaseName: 'peerslate-database'
  productionBaseUrl: 'https://peerslate.com'
  candidateBaseUrl: 'https://peerslate-candidate.azurewebsites.net'
  pipAuditVersion: '2.10.1'
  gitleaksVersion: '8.30.1'
  gitleaksLinuxX64Sha256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

stages:
  - stage: Build
    displayName: Build
    condition: ne(variables['Build.Reason'], 'Schedule')
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install requirements

          - script: python -m pip check
            displayName: Verify dependency compatibility

          - script: |
              set -euo pipefail
              scanner="$(Agent.TempDirectory)/pip-audit"
              python -m venv "$scanner"
              "$scanner/bin/python" -m pip install --quiet "pip-audit==$(pipAuditVersion)"
              mkdir -p "$(Build.ArtifactStagingDirectory)/evidence"
              "$scanner/bin/python" -m pip_audit \
                --requirement requirements.txt \
                --strict \
                --progress-spinner off \
                --format json \
                --output "$(Build.ArtifactStagingDirectory)/evidence/pip-audit.json"
            displayName: Scan dependencies for known vulnerabilities

          - script: |
              set -euo pipefail
              scanner_dir="$(Agent.TempDirectory)/gitleaks"
              archive="$scanner_dir/gitleaks.tar.gz"
              mkdir -p "$scanner_dir" "$(Build.ArtifactStagingDirectory)/evidence"
              curl --fail --silent --show-error --location \
                --output "$archive" \
                "https://github.com/gitleaks/gitleaks/releases/download/v$(gitleaksVersion)/gitleaks_$(gitleaksVersion)_linux_x64.tar.gz"
              printf '%s  %s\n' "$(gitleaksLinuxX64Sha256)" "$archive" \
                | sha256sum --check -
              tar -xzf "$archive" -C "$scanner_dir" gitleaks
              "$scanner_dir/gitleaks" git . \
                --config .gitleaks.toml \
                --redact=100 \
                --report-format json \
                --report-path "$(Build.ArtifactStagingDirectory)/evidence/gitleaks.json" \
                --exit-code 1
            displayName: Scan full repository history for secrets

          - script: >-
              python -m compileall -q
              app.py auth_routes.py owner_routes.py peerslate_api.py
              people_interests_api.py services scripts
            displayName: Compile runtime and operational scripts

          - script: python -m unittest discover -s tests -q
            displayName: Run application and security tests
            env:
              ANTHROPIC_API_KEY: test-key-for-ci-only

          - script: python scripts/govern_sql_migrations.py check
            displayName: Validate migration registry before any approval

          - script: python scripts/generate_control_room_snapshot.py
            displayName: Generate Control Room snapshot
            env:
              BUILD_BUILDID: $(Build.BuildId)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)

          - script: >-
              python scripts/release_identity.py
              --source-version "$(Build.SourceVersion)"
              --build-id "$(Build.BuildId)"
            displayName: Generate immutable release identity

          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              # Ship only what the running site needs. Every exclusion below
              # was verified to have no runtime reader before being added.
              #
              # KEEP, despite being large or looking inert:
              #   docs/**       control_room_projection.py reads
              #                 docs/governance/ and docs/initiatives/ live to
              #                 build the Control Room, and app.py loads
              #                 docs/knowledge/ at startup for the chatbot.
              #   SQL FIles/**  small, and the migration tooling resolves it
              #                 by that exact (misspelled) path.
              #   static/images/Mockups/**, static/images/background-templates/**
              #                 partly live: resume2.css references
              #                 Mockups/resume2/, and three stylesheets
              #                 reference background-templates. Do not exclude
              #                 these wholesale.
              Contents: |
                **/*
                !.git/**
                !antenv/**
                !artifacts/**
                !tests/**
                !**/__pycache__/**
                !**/*.pyc
                !scripts/run_public_search_dark_proof.py
                !scripts/build_public_content_fixture_manifest.py
                !Design ideas/**
                !static/Background/**
                !static/Mockup/**
                !PeerSlate_Company_and_Product_Bible_v1.*.docx
                !.github/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/app'
            displayName: Prepare deployment package

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: Archive deployment package

          - script: >-
              python scripts/candidate_artifact.py
              --archive "$(Build.ArtifactStagingDirectory)/drop/$(Build.BuildId).zip"
              --output "$(Build.ArtifactStagingDirectory)/drop/candidate-manifest.json"
              --source-version "$(Build.SourceVersion)"
              --source-branch "$(Build.SourceBranch)"
              --build-id "$(Build.BuildId)"
              --python-version "$(pythonVersion)"
              --candidate-package "$CANDIDATE_PACKAGE"
              --candidate-source-branch "$CANDIDATE_SOURCE_BRANCH"
              --candidate-source-version "$CANDIDATE_SOURCE_VERSION"
            displayName: Record immutable candidate artifact hash
            env:
              # Queue values enter the process as data, never as Bash source.
              # candidate_artifact.py performs the format and exact-match
              # validation before any Candidate stage may run.
              CANDIDATE_PACKAGE: $(candidatePackage)
              CANDIDATE_SOURCE_BRANCH: $(candidateSourceBranch)
              CANDIDATE_SOURCE_VERSION: $(candidateSourceVersion)

          - upload: '$(Build.ArtifactStagingDirectory)/drop'
            artifact: drop
            displayName: Upload immutable deployment package

          - upload: '$(Build.ArtifactStagingDirectory)/evidence'
            artifact: CandidateEvidence
            displayName: Upload redacted scanner evidence

  # Azure evaluates the checks of every environment a stage references before
  # that stage starts, and it does so from the stage's static text -- a job
  # condition that skips the job does not remove its environment from the
  # evaluation. Keeping the web deployment and the schema operation in one
  # stage therefore dragged every routine deploy through the
  # `peerslate-database-schema` approval: run 711 was batchedCI with
  # schemaAction=none and forceProductionDeploy=false, had no database work to
  # do, and still parked at that gate.
  #
  # The stages remain separate so a web deployment never inherits the schema
  # approval and a schema plan still prints before that approval. Repository CI
  # enters neither production path. No Azure environment or check configuration
  # changes here; the schema gate remains a human decision. See
  # docs/initiatives/PS-AGENT-OPERATIONS-001/README.md.
  - stage: ProductionWebDeploy
    displayName: Deploy the production application
    dependsOn: Build
    # This stage references only `$(environmentName)`, which carries the shared
    # production lock. Automatic main and PR runs never enter this stage.
    # `sequential` is required rather than decorative: the default lock
    # behaviour is `runLatest`, which would cancel a queued run in favour of a
    # later one.
    lockBehavior: sequential
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.Reason'], 'Manual'),
        or(
          ${{ eq(parameters.forceProductionDeploy, true) }},
          ${{ ne(parameters.schemaAction, 'none') }}
        )
      )
    jobs:
      - job: ValidateProductionOperationRequest
        displayName: Validate the exact production operation request
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python scripts/production_operation_preflight.py \
                --build-reason "$BUILD_REASON" \
                --source-branch "$BUILD_SOURCE_BRANCH" \
                --source-version "$BUILD_SOURCE_VERSION" \
                --force-production-deploy "$FORCE_PRODUCTION_DEPLOY" \
                --manual-source-version "$MANUAL_SOURCE_VERSION" \
                --production-authorization-reference "$PRODUCTION_AUTHORIZATION_REFERENCE" \
                --schema-action "$SCHEMA_ACTION" \
                --schema-migration-id "$SCHEMA_MIGRATION_ID" \
                --schema-rollback-confirm "$SCHEMA_ROLLBACK_CONFIRM" \
                --collection-uri "$SYSTEM_COLLECTION_URI" \
                --project-id "$SYSTEM_PROJECT_ID" \
                --definition-id "$SYSTEM_DEFINITION_ID" \
                --build-id "$BUILD_ID"
            displayName: Refuse overlapping or duplicate production work
            env:
              BUILD_REASON: $(Build.Reason)
              BUILD_SOURCE_BRANCH: $(Build.SourceBranch)
              BUILD_SOURCE_VERSION: $(Build.SourceVersion)
              BUILD_ID: $(Build.BuildId)
              FORCE_PRODUCTION_DEPLOY: ${{ parameters.forceProductionDeploy }}
              MANUAL_SOURCE_VERSION: ${{ parameters.manualProductionSourceVersion }}
              PRODUCTION_AUTHORIZATION_REFERENCE: ${{ parameters.productionAuthorizationReference }}
              SCHEMA_ACTION: ${{ parameters.schemaAction }}
              SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
              SCHEMA_ROLLBACK_CONFIRM: ${{ parameters.schemaRollbackConfirm }}
              SYSTEM_COLLECTION_URI: $(System.CollectionUri)
              SYSTEM_PROJECT_ID: $(System.TeamProjectId)
              SYSTEM_DEFINITION_ID: $(System.DefinitionId)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - job: VerifyCommunitySchemaBeforeDeploy
        displayName: Require Community schema before web deployment
        dependsOn: ValidateProductionOperationRequest
        condition: >-
          and(
            succeeded(),
            ${{ eq(parameters.forceProductionDeploy, true) }}
          )
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements-sql.txt
            displayName: Install SQL release-gate dependencies

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: >-
                python scripts/verify_community_release_schema.py
                --expect-database "$(schemaDatabaseName)"
            displayName: Fail closed until the additive Community migration is applied
            env:
              AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)

      - deployment: DeployWebApp
        dependsOn:
          - ValidateProductionOperationRequest
          - VerifyCommunitySchemaBeforeDeploy
        condition: >-
          and(
            succeeded(),
            ${{ eq(parameters.forceProductionDeploy, true) }}
          )
        environment: $(environmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                  clean: true

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: Use Python $(pythonVersion)

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(webAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(webAppName)

                - script: >-
                    python scripts/verify_deployment_smoke.py
                    --base-url "$(productionBaseUrl)"
                    --expected-source-version "$(Build.SourceVersion)"
                    --expected-build-id "$(Build.BuildId)"
                    --warmup-seconds 420
                    --retry-delay 10
                    --timeout 15
                  displayName: Verify liveness and canonical public routes

  # This stage deliberately references no `environment:` at all. Its connected
  # step authenticates through a service connection, and a service connection
  # carries no checks, so the read-only plan is printed BEFORE the schema
  # approval is requested rather than after it. Adding an `environment:` here
  # would reinstate the ordering defect recorded as
  # `pipeline_schema_checkpoint_order` without any test or run failing loudly.
  - stage: SchemaReadOnlyPreflight
    displayName: Read schema state before any approval is requested
    dependsOn: ProductionWebDeploy
    # Schema is manual-only. A schema-only run enters the request-validation
    # stage above while its web deployment jobs remain skipped, then prints this
    # plan before Azure requests the schema approval.
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.Reason'], 'Manual'),
        ${{ ne(parameters.schemaAction, 'none') }}
      )
    jobs:
      - job: SchemaReadOnlyPreflight
        displayName: Read and validate schema state before approval
        # The stage condition already gates this, and the job repeats it so a
        # future stage-condition edit cannot quietly let a `none` run connect.
        condition: >-
          and(
            succeeded(),
            ${{ ne(parameters.schemaAction, 'none') }}
          )
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install requirements

          - script: python scripts/govern_sql_migrations.py check
            displayName: Revalidate migration registry and gate proofs

          - script: mkdir -p "$(Build.ArtifactStagingDirectory)/schema-preflight"
            displayName: Prepare schema preflight evidence directory

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                python scripts/govern_sql_migrations.py \
                  --azure-pipelines \
                  --emit-evidence \
                  "$(Build.ArtifactStagingDirectory)/schema-preflight/preflight.json" \
                  preflight "$SCHEMA_ACTION" \
                  --migration-id "$SCHEMA_MIGRATION_ID" \
                  --confirm "$SCHEMA_ROLLBACK_CONFIRM" \
                  --expect-database "$(schemaDatabaseName)"
            displayName: Refuse unsafe schema request before approval
            env:
              AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
              SCHEMA_ACTION: ${{ parameters.schemaAction }}
              SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
              SCHEMA_ROLLBACK_CONFIRM: ${{ parameters.schemaRollbackConfirm }}
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_BUILDID: $(Build.BuildId)

          - publish: '$(Build.ArtifactStagingDirectory)/schema-preflight'
            artifact: SchemaPreflightEvidence
            condition: always()
            displayName: Publish read-only schema preflight evidence

  # The only stage that references `peerslate-database-schema`, and therefore
  # the only stage that requests its approval. That approval is a human
  # decision by intent and is untouched by this split.
  - stage: SchemaApply
    displayName: Run the approved schema operation
    dependsOn: SchemaReadOnlyPreflight
    # Required, not decorative. Without it the exclusive lock this stage
    # borrows below defaults to `runLatest`, and a queued schema run would be
    # cancelled in favour of a later one. Schema is not a cumulative artifact,
    # so a dropped run is a lost operation rather than a superseded one.
    lockBehavior: sequential
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.Reason'], 'Manual'),
        ${{ ne(parameters.schemaAction, 'none') }}
      )
    jobs:
      - deployment: GovernedSchemaMigration
        displayName: Run the approved schema operation
        condition: >-
          and(
            succeeded(),
            ${{ ne(parameters.schemaAction, 'none') }}
          )
        environment: peerslate-database-schema
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  persistCredentials: false
                  clean: true

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '$(pythonVersion)'
                  displayName: Use Python $(pythonVersion)

                - script: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
                  displayName: Install requirements

                - script: python scripts/govern_sql_migrations.py check
                  displayName: Validate the migration registry and gate proofs

                - ${{ if eq(parameters.schemaAction, 'report') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: >-
                          python scripts/govern_sql_migrations.py
                          --azure-pipelines
                          --emit-evidence "$(Build.ArtifactStagingDirectory)/schema/report.json"
                          --print-state
                          report
                          --expect-database "$(schemaDatabaseName)"
                          --write-state
                      displayName: Read the ledger and render the repository record
                      env:
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                - ${{ if eq(parameters.schemaAction, 'apply') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          python scripts/govern_sql_migrations.py \
                            --azure-pipelines \
                            --emit-evidence \
                            "$(Build.ArtifactStagingDirectory)/schema/apply.json" \
                            --print-state \
                            apply \
                            --migration "$SCHEMA_MIGRATION_ID" \
                            --expect "$SCHEMA_MIGRATION_ID" \
                            --expect-database "$(schemaDatabaseName)" \
                            --write-state
                      displayName: Apply the one expected pending gated migration
                      env:
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                - ${{ if eq(parameters.schemaAction, 'rollback') }}:
                    - task: AzureCLI@2
                      inputs:
                        azureSubscription: $(azureServiceConnectionId)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          set -euo pipefail
                          python scripts/govern_sql_migrations.py \
                            --azure-pipelines \
                            --emit-evidence \
                            "$(Build.ArtifactStagingDirectory)/schema/rollback.json" \
                            --print-state \
                            rollback "$SCHEMA_MIGRATION_ID" \
                            --confirm "$SCHEMA_ROLLBACK_CONFIRM" \
                            --expect-database "$(schemaDatabaseName)" \
                            --write-state
                      displayName: Roll back the most recently applied migration
                      env:
                        AZURE_SQL_CONNECTIONSTRING: $(schemaConnectionString)
                        SCHEMA_MIGRATION_ID: ${{ parameters.schemaMigrationId }}
                        SCHEMA_ROLLBACK_CONFIRM: ${{ parameters.schemaRollbackConfirm }}
                        BUILD_SOURCEVERSION: $(Build.SourceVersion)
                        BUILD_BUILDID: $(Build.BuildId)

                - script: |
                    set -euo pipefail
                    mkdir -p "$(Build.ArtifactStagingDirectory)/schema"
                    if [ -f docs/governance/PRODUCTION_SCHEMA_STATE.md ]; then
                      cp docs/governance/PRODUCTION_SCHEMA_STATE.md \
                        "$(Build.ArtifactStagingDirectory)/schema/"
                    fi
                  condition: always()
                  displayName: Stage the regenerated repository record

                - publish: '$(Build.ArtifactStagingDirectory)/schema'
                  artifact: SchemaMigrationEvidence
                  condition: always()
                  displayName: Publish schema migration evidence

      # Serialization, not a deployment. Do not delete this job to tidy the
      # stage: it is the only thing restoring a property the previous single
      # `ProductionOperation` stage provided for free.
      #
      # A stage takes an environment's exclusive lock only if the stage
      # references that environment. `$(environmentName)` carries that lock, so
      # referencing it here means `ProductionWebDeploy` in one run and
      # `SchemaApply` in another still cannot overlap, and two schema runs
      # still queue behind each other. The property is written down in
      # docs/initiatives/PS-OPS-001/GOVERNED_SCHEMA_MIGRATION_PATH.md; removing
      # this job makes that document untrue with nothing failing.
      #
      # It installs nothing, ships no package, and issues no database command.
      # It does leave a deployment record against the application environment,
      # so read that environment's history by the stage name rather than
      # assuming every entry shipped code.
      - deployment: HoldSharedProductionReservation
        displayName: Hold the shared production reservation (ships nothing)
        environment: $(environmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: none

                # Same discipline as the Build and skipped-release stages: no
                # macro is expanded into Bash source here. The environment this
                # job reserves is the one named on the `environment:` key above.
                - script: |
                    echo "Reservation only. This job deploys no application"
                    echo "package and runs no database command. It exists so"
                    echo "that this stage references the application"
                    echo "environment and takes its exclusive lock, which"
                    echo "serializes schema operations against production"
                    echo "deployments across runs."
                  displayName: Record that this reservation ships nothing

  # Every main run with no requested production operation says so explicitly.
  # Automatic main runs remain ordinary successful CI. A manually queued no-op
  # is marked succeeded-with-issues so it cannot be mistaken for a deployment.
  - stage: ProductionReleaseSkipped
    displayName: Report that production was not deployed
    dependsOn: Build
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ${{ eq(parameters.forceProductionDeploy, false) }},
        ${{ eq(parameters.schemaAction, 'none') }}
      )
    jobs:
      - job: AnnounceSkippedProductionRelease
        displayName: Announce skipped production release
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: none

          - script: |
              set -euo pipefail
              echo "Main SHA $BUILT_SOURCE_VERSION passed the repository pipeline"
              echo "without a production operation. Production was NOT updated."
              echo "A merge is not a deployment. Confirm the deployed release"
              echo "identity before reporting any change as live."
              if [ "$BUILD_REASON" = "Manual" ]; then
                echo "##vso[task.logissue type=warning]Manual main run requested no production operation. Production was NOT updated."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              fi
            displayName: Record CI-only main result
            env:
              # Same discipline as the Build stage: the SHA enters the process
              # as data, never as Bash source.
              BUILT_SOURCE_VERSION: $(Build.SourceVersion)
              BUILD_REASON: $(Build.Reason)

  - stage: CandidateDeploy
    displayName: Deploy isolated candidate
    dependsOn: Build
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - deployment: DeployCandidateWebApp
        environment: $(candidateEnvironmentName)
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: >-
                      az webapp start
                      --resource-group peerslate
                      --name "$(candidateWebAppName)"
                  displayName: Start isolated candidate

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appName: $(candidateWebAppName)
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                  displayName: Deploy to $(candidateWebAppName)

  - stage: CandidateSmoke
    displayName: Verify isolated candidate
    dependsOn: CandidateDeploy
    condition: >-
      and(
        succeeded(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: CandidatePublicBoundarySmoke
        displayName: Candidate boundary smoke
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: >-
              python scripts/verify_deployment_smoke.py
              --base-url "$(candidateBaseUrl)"
              --expected-source-version "$(Build.SourceVersion)"
              --expected-build-id "$(Build.BuildId)"
              --warmup-seconds 180
              --retry-delay 10
              --timeout 15
            displayName: Verify candidate identity and public boundary

  - stage: CandidateStop
    displayName: Exercise and enforce candidate stop
    dependsOn: CandidateSmoke
    condition: >-
      and(
        always(),
        ne(variables['candidatePackage'], ''),
        eq(
          variables['Build.SourceBranch'],
          variables['candidateSourceBranch']
        ),
        eq(
          variables['Build.SourceVersion'],
          variables['candidateSourceVersion']
        )
      )
    jobs:
      - job: StopCandidateWebApp
        displayName: Stop isolated candidate
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp stop \
                  --resource-group peerslate \
                  --name "$(candidateWebAppName)"
                state="$(
                  az webapp show \
                    --resource-group peerslate \
                    --name "$(candidateWebAppName)" \
                    --query state \
                    --output tsv
                )"
                test "$state" = "Stopped"
                echo "Candidate stop action passed; state=$state"
            displayName: Stop candidate and verify Azure state

  - stage: CommunityMaintenance
    displayName: Run independently gated Community maintenance
    dependsOn: []
    # Pinned to its own schedule display name so a second cron on this
    # pipeline (the Interview telemetry purge) can never trigger Community
    # maintenance, and vice versa. The hourly Community behaviour under its
    # own schedule is unchanged.
    condition: >-
      and(
        eq(variables['Build.Reason'], 'Schedule'),
        eq(variables['Build.CronSchedule.DisplayName'], 'Community maintenance hourly'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: RunCommunityMaintenance
        displayName: Run bounded media and retention maintenance
        timeoutInMinutes: 10
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python -m pip check
            displayName: Install and verify maintenance dependencies
            condition: eq(variables['communityMaintenanceEnabled'], 'true')

          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/community-maintenance"
              python scripts/run_community_maintenance.py \
                --budget-seconds 120 \
                --media-batch 20 \
                --expect-database "$(schemaDatabaseName)" \
                | tee "$(Build.ArtifactStagingDirectory)/community-maintenance/report.json"
            displayName: Record independently disabled maintenance
            condition: ne(variables['communityMaintenanceEnabled'], 'true')
            env:
              PEERSLATE_COMMUNITY_MAINTENANCE_ENABLED: $(communityMaintenanceEnabled)

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(communityMaintenanceServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                python scripts/configure_community_maintenance_sql_authority.py verify \
                  --principal-client-id "$(communityMaintenancePrincipalClientId)"
            displayName: Verify narrow maintenance SQL authority
            condition: eq(variables['communityMaintenanceEnabled'], 'true')

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(communityMaintenanceServiceConnectionId)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                mkdir -p "$(Build.ArtifactStagingDirectory)/community-maintenance"
                python scripts/run_community_maintenance.py \
                  --budget-seconds 120 \
                  --media-batch 20 \
                  --expect-database "$(schemaDatabaseName)" \
                  | tee "$(Build.ArtifactStagingDirectory)/community-maintenance/report.json"
            displayName: Run the default-off bounded maintenance command
            condition: eq(variables['communityMaintenanceEnabled'], 'true')
            env:
              # All values are pipeline metadata, not App Service reads.
              # communityMaintenanceEnabled is created as false before this
              # schedule is merged and is the only maintenance enable switch.
              PEERSLATE_COMMUNITY_MAINTENANCE_ENABLED: $(communityMaintenanceEnabled)
              CAPTURE_MEDIA_BLOB_ACCOUNT_URL: $(communityMediaBlobAccountUrl)
              CAPTURE_MEDIA_BLOB_CONTAINER: $(communityMediaBlobContainer)
              AZURE_SQL_CONNECTIONSTRING: $(communityMaintenanceSqlConnectionString)

          - publish: '$(Build.ArtifactStagingDirectory)/community-maintenance'
            artifact: CommunityMaintenanceEvidence
            condition: always()
            displayName: Publish content-free maintenance evidence

  # PS-INTERVIEW-AI-EXTRACT-001: the Interview telemetry retention purge.
  # Fires only on its own named schedule, shares no identity, variable, or
  # connection with Community maintenance, and every operative step is
  # gated behind interviewTelemetryMaintenanceEnabled, which does not exist
  # until an operator creates it (default off). Until then a scheduled run
  # of this stage records a disabled report and exits. Bounded failure is
  # visible: the purge report artifact publishes on every run, including
  # failures.
  - stage: InterviewTelemetryMaintenance
    displayName: Run independently gated Interview telemetry retention
    dependsOn: []
    condition: >-
      and(
        eq(variables['Build.Reason'], 'Schedule'),
        eq(variables['Build.CronSchedule.DisplayName'], 'Interview telemetry retention nightly'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: RunInterviewTelemetryPurge
        displayName: Run the bounded 90-day telemetry purge
        timeoutInMinutes: 10
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1
            persistCredentials: false
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python $(pythonVersion)

          # Correction C1: a valid, content-free report must exist BEFORE
          # any dependency install or purge is attempted, so a failed
          # install or purge can never publish an empty or missing
          # artifact. `purge_did_not_run` comes from the purge tool's own
          # closed reason enum. Later steps overwrite this file; if they
          # never run, this bounded truth is what publishes.
          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/interview-telemetry-maintenance"
              printf '{"reason": "purge_did_not_run", "result": "failed"}\n' \
                > "$(Build.ArtifactStagingDirectory)/interview-telemetry-maintenance/report.json"
            displayName: Guarantee a content-free retention report
            condition: always()

          - script: |
              set -euo pipefail
              printf '{"reason": "retention_not_enabled", "result": "disabled"}\n' \
                | tee "$(Build.ArtifactStagingDirectory)/interview-telemetry-maintenance/report.json"
            displayName: Record independently disabled retention
            condition: >-
              and(
                succeeded(),
                ne(variables['interviewTelemetryMaintenanceEnabled'], 'true')
              )

          # Operative steps keep succeeded() as well as the enablement
          # check (C1): an enable variable alone would let a step run
          # after an earlier step in this job had already failed.
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python -m pip check
            displayName: Install and verify purge dependencies
            condition: >-
              and(
                succeeded(),
                eq(variables['interviewTelemetryMaintenanceEnabled'], 'true')
              )

          # Defect correction (Extract completion, 2026-08-22): the purge
          # must run INSIDE an AzureCLI task bound to the dedicated Interview
          # maintenance service connection, exactly as Community maintenance
          # does. A plain script step has no identity on a hosted agent, so
          # the nonsecret ActiveDirectoryDefault connection could never
          # authenticate and every nightly run would report
          # connection_failed. The service connection is the Interview
          # workload-identity-federated one - never Community's and never the
          # schema/deployment connection.
          #
          # The task is inserted at COMPILE time only once the operator has
          # created the service connection and its nonsecret variable: Azure
          # resolves azureSubscription when the YAML compiles, so a reference
          # to an undefined connection would invalidate the whole pipeline.
          # Until then the step does not exist, the guaranteed fallback report
          # above still publishes, and retention stays default-off at compile
          # time as well as at run time.
          - ${{ if ne(variables['interviewTelemetryMaintenanceServiceConnectionId'], '') }}:
            - task: AzureCLI@2
              displayName: Run the default-off bounded retention purge
              condition: >-
                and(
                  succeeded(),
                  eq(variables['interviewTelemetryMaintenanceEnabled'], 'true')
                )
              inputs:
                azureSubscription: $(interviewTelemetryMaintenanceServiceConnectionId)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  python scripts/interview_ai/run_interview_telemetry_purge.py \
                    --batch-size 1000 \
                    --max-batches 10 \
                    --expect-database "$(schemaDatabaseName)" \
                    | tee "$(Build.ArtifactStagingDirectory)/interview-telemetry-maintenance/report.json"
              env:
                # The dedicated Interview maintenance identity's connection
                # string - deliberately NOT the application connection and NOT
                # the Community maintenance connection. Created by an operator
                # only after the telemetry migration is applied and the
                # maintenance identity is bound into the
                # interview_telemetry_maintenance role.
                INTERVIEW_TELEMETRY_SQL_CONNECTIONSTRING: $(interviewTelemetryMaintenanceSqlConnectionString)

          - publish: '$(Build.ArtifactStagingDirectory)/interview-telemetry-maintenance'
            artifact: InterviewTelemetryMaintenanceEvidence
            condition: always()
            displayName: Publish content-free retention evidence
