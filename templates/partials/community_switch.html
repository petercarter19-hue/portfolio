{# The Feed ⇄ The Break switcher (2026-07-17): a prominent segmented
   control shared by both views. Set `community_active` before including. #}
<nav class="feed-switch" aria-label="Community views">
    <a class="feed-switch__tab{% if community_active == 'feed' %} active{% endif %}"
       href="{{ url_for('feed_living_stream') }}"{% if community_active == 'feed' %} aria-current="page"{% endif %}>
        <svg class="icon sm" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><use href="#i-feed"/></svg>
        Feed
    </a>
    <a class="feed-switch__tab{% if community_active == 'break' %} active{% endif %}"
       href="/the-slate/break"{% if community_active == 'break' %} aria-current="page"{% endif %}>
        <svg class="icon sm" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><use href="#i-cup"/></svg>
        The Break
    </a>
</nav>
