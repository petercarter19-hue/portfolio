{# Shared mobile bottom bar for the community shell (Feed + The Break).
   Set `community_active` to 'feed' or 'break' before including. #}
<nav class="mobile-bottom" aria-label="Community sections">
    <a class="mobile-nav" href="/the-slate/my-slate"><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-journal"/></svg><span>My Slate</span></a>
    <a class="mobile-nav" href="/slate-board"><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-board"/></svg><span>Board</span></a>
    {% if community_active == 'feed' %}
    <button class="mobile-nav" type="button" data-open-voice><span class="capture-fab"><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><use href="#i-mic"/></svg></span><span>Capture</span></button>
    {% else %}
    <a class="mobile-nav" href="{{ url_for('feed_living_stream') }}?state=voice"><span class="capture-fab"><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><use href="#i-mic"/></svg></span><span>Capture</span></a>
    {% endif %}
    <a class="mobile-nav{% if community_active == 'feed' %} active{% endif %}" href="{{ url_for('feed_living_stream') }}"{% if community_active == 'feed' %} aria-current="page"{% endif %}><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-feed"/></svg><span>Feed</span></a>
    <a class="mobile-nav{% if community_active == 'break' %} active{% endif %}" href="/the-slate/break"{% if community_active == 'break' %} aria-current="page"{% endif %}><svg class="icon" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><use href="#i-cup"/></svg><span>The Break</span></a>
</nav>
