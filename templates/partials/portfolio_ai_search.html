{# Shared inline Ask AI form. Pages may set ai_owner_name before including
   this partial (e.g. from profile fixture data); it defaults to Pete so
   every existing include renders exactly as before. #}
{% set ai_owner = ai_owner_name | default('Pete') %}
<form class="hero-ai-search" data-hero-ai-search aria-label="Ask {{ ai_owner }} AI">
    <label class="hero-ai-search__label" for="hero-ai-input">
        Ask {{ ai_owner }} AI
    </label>
    <div class="hero-ai-search__box">
        <input
            id="hero-ai-input"
            class="hero-ai-search__input"
            type="text"
            placeholder="Ask about {{ ai_owner }}'s experience, skills, projects, or results..."
            autocomplete="off"
            maxlength="240"
        >
        <button class="hero-ai-search__button" type="submit">
            Ask
        </button>
    </div>
    <p class="hero-ai-search__status" data-hero-ai-status aria-live="polite">
        Answers use approved public portfolio evidence.
    </p>
    <div
        class="hero-ai-answer"
        data-hero-ai-answer
        aria-live="polite"
        hidden
    ></div>
</form>
