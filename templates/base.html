<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic browser and mobile-device setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Helps search engines understand the purpose of the website -->
    <meta
        name="description"
        content="The engineering portfolio of Pete Carter, a systems engineer focused on digital engineering, MBSE, software automation, and AI-enabled systems."
    >

    <!-- Jinja block: each page can provide its own browser-tab title -->
    <title>{% block title %}Pete Carter{% endblock %}</title>

    <!-- Flask generates the correct path to static/css/style.css -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Accessibility feature for keyboard and screen-reader users -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Shared site header and navigation -->
    <header class="site-header">
        <nav class="navbar" aria-label="Primary navigation">
            <div class="nav-container">

                <a href="/" class="nav-logo">Pete Carter</a>

                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/work">Work Experience</a></li>
                    <li><a href="/skills">Skills</a></li>
                    <li><a href="/hobbies">Hobbies</a></li>
                    <li><a href="/contact">Contact</a></li>
                </ul>

            </div>
        </nav>
    </header>

    <!-- Each page inserts its unique content inside this Jinja block -->
    <main id="main-content" class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Shared footer displayed on every page -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 Pete Carter <span>|</span> Athens, Alabama</p>
        </div>
    </footer>

</body>

</html>
