<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Owner Home access and lifecycle evidence</title>
    <desc id="svg-desc">Empty published projection, unpublished, revoked, deleted, session expired, timeout, and fail-closed treatments.</desc>
    <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03080D"/><stop offset=".55" stop-color="#071421"/><stop offset="1" stop-color="#12283B"/></linearGradient>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#050B12"/><stop offset=".55" stop-color="#0B1A28"/><stop offset="1" stop-color="#39434A"/></linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9AA2B" stop-opacity="0"/><stop offset=".74" stop-color="#D9AA2B" stop-opacity=".06"/><stop offset="1" stop-color="#F0B340" stop-opacity=".34"/></linearGradient>
    <linearGradient id="copyVeil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050B12" stop-opacity=".98"/><stop offset=".68" stop-color="#071421" stop-opacity=".74"/><stop offset="1" stop-color="#071421" stop-opacity=".06"/></linearGradient>
    <linearGradient id="photoVeil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050B12" stop-opacity=".98"/><stop offset=".46" stop-color="#071421" stop-opacity=".68"/><stop offset=".78" stop-color="#071421" stop-opacity=".2"/><stop offset="1" stop-color="#071421" stop-opacity=".08"/></linearGradient>
    <linearGradient id="copyZone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1C2A" stop-opacity="1"/><stop offset=".78" stop-color="#0B1C2A" stop-opacity=".96"/><stop offset="1" stop-color="#0B1C2A" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31404D" stop-opacity=".83"/><stop offset=".55" stop-color="#141E28" stop-opacity=".91"/><stop offset="1" stop-color="#080E15" stop-opacity=".96"/></linearGradient>
    <linearGradient id="ivoryStage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#EEE7DC"/></linearGradient>
    <linearGradient id="warmPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E5BA"/><stop offset="1" stop-color="#D9B968"/></linearGradient>
    <linearGradient id="dormantNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12283A"/><stop offset="1" stop-color="#071421"/></linearGradient>
    <linearGradient id="brandFog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20394F" stop-opacity=".1"/><stop offset=".5" stop-color="#D9AA2B" stop-opacity=".2"/><stop offset="1" stop-color="#20394F" stop-opacity=".04"/></linearGradient>
    <radialGradient id="goldOrb"><stop offset="0" stop-color="#F7D77E" stop-opacity=".95"/><stop offset=".38" stop-color="#D9AA2B" stop-opacity=".36"/><stop offset="1" stop-color="#D9AA2B" stop-opacity="0"/></radialGradient>
    <pattern id="quietLines" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><line x1="0" y1="0" x2="0" y2="18" stroke="#B87900" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="softShadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#08101A" flood-opacity=".18"/></filter>
    <clipPath id="roundApp"><rect x="40" y="28" width="1360" height="1044" rx="24"/></clipPath>
  </defs><rect x="0" y="0" width="1440" height="1080" rx="0" fill="url(#bgNavy)" stroke="none" stroke-width="0" opacity="1" /><rect x="40" y="28" width="1360" height="1024" rx="24" fill="#07111C" stroke="#6C7277" stroke-width="1.2" opacity="1" filter="url(#shadow)"/><g data-component="brand-logo"><text x="64" y="78" font-family="Georgia" font-size="28" font-weight="500" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >PeerSlate</text><line x1="64" y1="88" x2="118" y2="88" stroke="#D9AA2B" stroke-width="2" opacity="0.8" /></g><text x="64" y="136" font-family="Georgia" font-size="34" font-weight="500" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >Access and lifecycle evidence</text><text x="64" y="166" font-family="Arial" font-size="11" font-weight="400" fill="#C3CBD2" text-anchor="start" letter-spacing="0" >Neutral component treatments only · no owner controls or viewer payload are present on this evidence board.</text><rect x="1138" y="62" width="228" height="30" rx="15" fill="#111D27" stroke="#7A6132" stroke-width="1" opacity="1" /><text x="1252" y="82.1" font-family="Arial" font-size="9" font-weight="700" fill="#F2D992" text-anchor="middle" letter-spacing="0.8" >STATIC DESIGN EVIDENCE</text><g data-component="lifecycle-state" data-state="viewer-empty-/-unpublished"><rect x="64" y="206" width="644" height="230" rx="16" fill="#FBF8F2" stroke="#D6CDBF" stroke-width="1.4" opacity="1" /><rect x="84" y="224" width="224" height="28" rx="14" fill="#F3EEE6" stroke="#BCA46C" stroke-width="1" opacity="1" /><text x="196" y="242.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#8A5A00" text-anchor="middle" letter-spacing="0.8" >VIEWER EMPTY / UNPUBLISHED</text><text x="84" y="288" font-family="Georgia" font-size="20" font-weight="600" fill="#151820" text-anchor="start" letter-spacing="0" >No eligible published content in this view.</text><text x="84" y="322" font-family="Arial" font-size="11" font-weight="400" fill="#666B70" text-anchor="start" ><tspan x="84" dy="0">Viewer empty: an authorized projection exists with zero eligible items.</tspan><tspan x="84" dy="17">Unpublished: no viewer projection exists. Neither implies private content.</tspan></text><rect x="84" y="376" width="156" height="40" rx="10" fill="#071421" stroke="#071421" stroke-width="1.2" opacity="1" /><text x="162" y="401" font-family="Arial" font-size="9" font-weight="800" fill="#FFFDF8" text-anchor="middle" letter-spacing="0.35" >SAFE RETURN</text></g><g data-component="lifecycle-state" data-state="access-changed-·-revoked"><rect x="732" y="206" width="644" height="230" rx="16" fill="#0B1824" stroke="#31485D" stroke-width="1.4" opacity="1" /><rect x="752" y="224" width="224" height="28" rx="14" fill="#142A3C" stroke="#668096" stroke-width="1" opacity="1" /><text x="864" y="242.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#F2D992" text-anchor="middle" letter-spacing="0.8" >ACCESS CHANGED · REVOKED</text><text x="752" y="288" font-family="Georgia" font-size="20" font-weight="600" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >Access has changed.</text><text x="752" y="322" font-family="Arial" font-size="11" font-weight="400" fill="#C3CCD3" text-anchor="start" ><tspan x="752" dy="0">Previously rendered sensitive content is cleared before</tspan><tspan x="752" dy="17">this heading receives focus. No stale fallback remains.</tspan></text><rect x="741" y="253" width="626" height="54" rx="13" fill="none" stroke="#FFD75E" stroke-width="4" opacity="1" /><rect x="737" y="249" width="634" height="62" rx="17" fill="none" stroke="#071421" stroke-width="2" opacity="1" /><rect x="752" y="376" width="156" height="40" rx="10" fill="#000" stroke="#FFF" stroke-width="1.2" opacity="1" /><text x="830" y="401" font-family="Arial" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle" letter-spacing="0.35" >RETURN SAFELY</text></g><g data-component="lifecycle-state" data-state="deleted"><rect x="64" y="466" width="644" height="230" rx="16" fill="#FBF8F2" stroke="#D6CDBF" stroke-width="1.4" opacity="1" /><rect x="84" y="484" width="224" height="28" rx="14" fill="#F3EEE6" stroke="#BCA46C" stroke-width="1" opacity="1" /><text x="196" y="502.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#8A5A00" text-anchor="middle" letter-spacing="0.8" >DELETED</text><text x="84" y="548" font-family="Georgia" font-size="20" font-weight="600" fill="#151820" text-anchor="start" letter-spacing="0" >This source is no longer available.</text><text x="84" y="582" font-family="Arial" font-size="11" font-weight="400" fill="#666B70" text-anchor="start" ><tspan x="84" dy="0">Approved tombstone only. No reconstructed title, body,</tspan><tspan x="84" dy="17">media, timestamp, relationship, or prior action remains.</tspan></text><rect x="84" y="636" width="156" height="40" rx="10" fill="#071421" stroke="#071421" stroke-width="1.2" opacity="1" /><text x="162" y="661" font-family="Arial" font-size="9" font-weight="800" fill="#FFFDF8" text-anchor="middle" letter-spacing="0.35" >RETURN TO HOME</text></g><g data-component="lifecycle-state" data-state="session-expired"><rect x="732" y="466" width="644" height="230" rx="16" fill="#0B1824" stroke="#31485D" stroke-width="1.4" opacity="1" /><rect x="752" y="484" width="224" height="28" rx="14" fill="#142A3C" stroke="#668096" stroke-width="1" opacity="1" /><text x="864" y="502.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#F2D992" text-anchor="middle" letter-spacing="0.8" >SESSION EXPIRED</text><text x="752" y="548" font-family="Georgia" font-size="20" font-weight="600" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >Your private session ended.</text><text x="752" y="582" font-family="Arial" font-size="11" font-weight="400" fill="#C3CCD3" text-anchor="start" ><tspan x="752" dy="0">Protected data is cleared. The sign-in return carries no</tspan><tspan x="752" dy="17">private payload in its URL, title, or analytics label.</tspan></text><rect x="752" y="636" width="156" height="40" rx="10" fill="#000" stroke="#FFF" stroke-width="1.2" opacity="1" /><text x="830" y="661" font-family="Arial" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle" letter-spacing="0.35" >SIGN IN SAFELY</text></g><g data-component="lifecycle-state" data-state="slow-response-·-timeout"><rect x="64" y="726" width="644" height="230" rx="16" fill="#FBF8F2" stroke="#D6CDBF" stroke-width="1.4" opacity="1" /><rect x="84" y="744" width="224" height="28" rx="14" fill="#F3EEE6" stroke="#BCA46C" stroke-width="1" opacity="1" /><text x="196" y="762.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#8A5A00" text-anchor="middle" letter-spacing="0.8" >SLOW RESPONSE · TIMEOUT</text><text x="84" y="808" font-family="Georgia" font-size="20" font-weight="600" fill="#151820" text-anchor="start" letter-spacing="0" >This bounded request took too long.</text><text x="84" y="842" font-family="Arial" font-size="11" font-weight="400" fill="#666B70" text-anchor="start" ><tspan x="84" dy="0">Status updates without starting a duplicate request. Retry</tspan><tspan x="84" dy="17">repeats the same authorization scope; safe navigation remains.</tspan></text><rect x="84" y="896" width="156" height="40" rx="10" fill="#071421" stroke="#071421" stroke-width="1.2" opacity="1" /><text x="162" y="921" font-family="Arial" font-size="9" font-weight="800" fill="#FFFDF8" text-anchor="middle" letter-spacing="0.35" >RETRY</text><text x="260" y="921" font-family="Arial" font-size="9" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="0" >Same bounded request · no duplicate request</text></g><g data-component="lifecycle-state" data-state="not-found-·-fail-closed"><rect x="732" y="726" width="644" height="230" rx="16" fill="#0B1824" stroke="#31485D" stroke-width="1.4" opacity="1" /><rect x="752" y="744" width="224" height="28" rx="14" fill="#142A3C" stroke="#668096" stroke-width="1" opacity="1" /><text x="864" y="762.76" font-family="Arial" font-size="8.5" font-weight="700" fill="#F2D992" text-anchor="middle" letter-spacing="0.8" >NOT FOUND · FAIL CLOSED</text><text x="752" y="808" font-family="Georgia" font-size="20" font-weight="600" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >This item is not available.</text><text x="752" y="842" font-family="Arial" font-size="11" font-weight="400" fill="#C3CCD3" text-anchor="start" ><tspan x="752" dy="0">Unknown and direct-object requests use one neutral response.</tspan><tspan x="752" dy="17">The screen does not confirm that a private subject exists.</tspan></text><rect x="752" y="896" width="156" height="40" rx="10" fill="#000" stroke="#FFF" stroke-width="1.2" opacity="1" /><text x="830" y="921" font-family="Arial" font-size="9" font-weight="800" fill="#FFF" text-anchor="middle" letter-spacing="0.35" >SAFE RETURN</text></g><text x="64" y="1018" font-family="Arial" font-size="8" font-weight="700" fill="#9AA6B0" text-anchor="start" letter-spacing="0.4" >STATIC VISUAL EVIDENCE · DOM CLEARING, LIVE REGIONS, AUTHORIZATION, CACHE/MEDIA INVALIDATION, AND FOCUS MOVEMENT REQUIRE IMPLEMENTATION TESTS</text>
  </svg>