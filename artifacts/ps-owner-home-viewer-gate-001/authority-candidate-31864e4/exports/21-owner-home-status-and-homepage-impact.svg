<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Owner Home status and claim boundary</title>
    <desc id="svg-desc">Visual design, fixtures, future capability, implementation, deployment, live production, and homepage impact distinctions.</desc>
    <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03080D"/><stop offset=".55" stop-color="#071421"/><stop offset="1" stop-color="#12283B"/></linearGradient>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#050B12"/><stop offset=".55" stop-color="#0B1A28"/><stop offset="1" stop-color="#39434A"/></linearGradient>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9AA2B" stop-opacity="0"/><stop offset=".74" stop-color="#D9AA2B" stop-opacity=".06"/><stop offset="1" stop-color="#F0B340" stop-opacity=".34"/></linearGradient>
    <linearGradient id="copyVeil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050B12" stop-opacity=".98"/><stop offset=".68" stop-color="#071421" stop-opacity=".74"/><stop offset="1" stop-color="#071421" stop-opacity=".06"/></linearGradient>
    <linearGradient id="photoVeil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050B12" stop-opacity=".98"/><stop offset=".46" stop-color="#071421" stop-opacity=".68"/><stop offset=".78" stop-color="#071421" stop-opacity=".2"/><stop offset="1" stop-color="#071421" stop-opacity=".08"/></linearGradient>
    <linearGradient id="copyZone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1C2A" stop-opacity="1"/><stop offset=".78" stop-color="#0B1C2A" stop-opacity=".96"/><stop offset="1" stop-color="#0B1C2A" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31404D" stop-opacity=".83"/><stop offset=".55" stop-color="#141E28" stop-opacity=".91"/><stop offset="1" stop-color="#080E15" stop-opacity=".96"/></linearGradient>
    <linearGradient id="ivoryStage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#EEE7DC"/></linearGradient>
    <linearGradient id="warmPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E5BA"/><stop offset="1" stop-color="#D9B968"/></linearGradient>
    <linearGradient id="dormantNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12283A"/><stop offset="1" stop-color="#071421"/></linearGradient>
    <linearGradient id="brandFog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20394F" stop-opacity=".1"/><stop offset=".5" stop-color="#D9AA2B" stop-opacity=".2"/><stop offset="1" stop-color="#20394F" stop-opacity=".04"/></linearGradient>
    <radialGradient id="goldOrb"><stop offset="0" stop-color="#F7D77E" stop-opacity=".95"/><stop offset=".38" stop-color="#D9AA2B" stop-opacity=".36"/><stop offset="1" stop-color="#D9AA2B" stop-opacity="0"/></radialGradient>
    <pattern id="quietLines" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><line x1="0" y1="0" x2="0" y2="18" stroke="#B87900" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="softShadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#08101A" flood-opacity=".18"/></filter>
    <clipPath id="roundApp"><rect x="40" y="28" width="1360" height="1044" rx="24"/></clipPath>
  </defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="url(#bgNavy)" stroke="none" stroke-width="0" opacity="1" /><text x="54" y="56" font-family="Arial" font-size="9" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.6" >STATUS AND CLAIM BOUNDARY</text><text x="54" y="108" font-family="Georgia" font-size="38" font-weight="500" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >What this package is—and is not.</text><text x="54" y="138" font-family="Arial" font-size="10" font-weight="400" fill="#B8C2CB" text-anchor="start" letter-spacing="0" >Every review artifact must preserve these distinctions.</text><rect x="54" y="190" width="636" height="164" rx="16" fill="#10283B" stroke="#344F65" stroke-width="1.2" opacity="1" /><text x="76" y="224" font-family="Arial" font-size="8" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.1" >VISUAL DESIGN</text><text x="76" y="264" font-family="Georgia" font-size="14" font-weight="600" fill="#FFFDF8" text-anchor="start" ><tspan x="76" dy="0">Editable proposed component reconstruction</tspan></text><rect x="76" y="306" width="170" height="30" rx="15" fill="#142A3C" stroke="#D9AA2B" stroke-width="1" opacity="1" /><text x="161" y="326.1" font-family="Arial" font-size="8" font-weight="700" fill="#D9AA2B" text-anchor="middle" letter-spacing="0.8" >IN REVIEW</text><rect x="720" y="190" width="636" height="164" rx="16" fill="#F2E4BC" stroke="#B9964B" stroke-width="1.2" opacity="1" /><text x="742" y="224" font-family="Arial" font-size="8" font-weight="750" fill="#8A5A00" text-anchor="start" letter-spacing="1.1" >FIXTURE</text><text x="742" y="264" font-family="Georgia" font-size="14" font-weight="600" fill="#151820" text-anchor="start" ><tspan x="742" dy="0">Generic test data; explicitly not member data</tspan></text><rect x="742" y="306" width="170" height="30" rx="15" fill="#FFF9EA" stroke="#F2D992" stroke-width="1" opacity="1" /><text x="827" y="326.1" font-family="Arial" font-size="8" font-weight="700" fill="#8A5A00" text-anchor="middle" letter-spacing="0.8" >DEMONSTRATION</text><rect x="54" y="382" width="636" height="164" rx="16" fill="#0C1B28" stroke="#344F65" stroke-width="1.2" opacity="1" /><text x="76" y="416" font-family="Arial" font-size="8" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.1" >FUTURE CAPABILITY</text><text x="76" y="456" font-family="Georgia" font-size="14" font-weight="600" fill="#FFFDF8" text-anchor="start" ><tspan x="76" dy="0">Visible production-quality silhouette; disabled; Coming later</tspan></text><rect x="76" y="498" width="170" height="30" rx="15" fill="#142A3C" stroke="#B7C6D2" stroke-width="1" opacity="1" /><text x="161" y="518.1" font-family="Arial" font-size="8" font-weight="700" fill="#B7C6D2" text-anchor="middle" letter-spacing="0.8" >NOT AVAILABLE</text><rect x="720" y="382" width="636" height="164" rx="16" fill="#0C1B28" stroke="#344F65" stroke-width="1.2" opacity="1" /><text x="742" y="416" font-family="Arial" font-size="8" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.1" >IMPLEMENTATION</text><text x="742" y="456" font-family="Georgia" font-size="14" font-weight="600" fill="#FFFDF8" text-anchor="start" ><tspan x="742" dy="0">No application code, route, DOM behavior, request, or backend</tspan><tspan x="742" dy="19">change</tspan></text><rect x="742" y="498" width="170" height="30" rx="15" fill="#142A3C" stroke="#D8B4AC" stroke-width="1" opacity="1" /><text x="827" y="518.1" font-family="Arial" font-size="8" font-weight="700" fill="#D8B4AC" text-anchor="middle" letter-spacing="0.8" >NOT PERFORMED</text><rect x="54" y="574" width="636" height="164" rx="16" fill="#0C1B28" stroke="#344F65" stroke-width="1.2" opacity="1" /><text x="76" y="608" font-family="Arial" font-size="8" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.1" >DEPLOYMENT</text><text x="76" y="648" font-family="Georgia" font-size="14" font-weight="600" fill="#FFFDF8" text-anchor="start" ><tspan x="76" dy="0">No pipeline, environment, release, or production asset</tspan></text><rect x="76" y="690" width="170" height="30" rx="15" fill="#142A3C" stroke="#D8B4AC" stroke-width="1" opacity="1" /><text x="161" y="710.1" font-family="Arial" font-size="8" font-weight="700" fill="#D8B4AC" text-anchor="middle" letter-spacing="0.8" >NOT PERFORMED</text><rect x="720" y="574" width="636" height="164" rx="16" fill="#0C1B28" stroke="#344F65" stroke-width="1.2" opacity="1" /><text x="742" y="608" font-family="Arial" font-size="8" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="1.1" >LIVE PRODUCTION</text><text x="742" y="648" font-family="Georgia" font-size="14" font-weight="600" fill="#FFFDF8" text-anchor="start" ><tspan x="742" dy="0">No claim that Owner Home, viewer modes, My Slate preview,</tspan><tspan x="742" dy="19">insight, or connections are live</tspan></text><rect x="742" y="690" width="170" height="30" rx="15" fill="#142A3C" stroke="#D8B4AC" stroke-width="1" opacity="1" /><text x="827" y="710.1" font-family="Arial" font-size="8" font-weight="700" fill="#D8B4AC" text-anchor="middle" letter-spacing="0.8" >NO CLAIM</text><rect x="54" y="792" width="1332" height="62" rx="14" fill="#0B1824" stroke="#725A30" stroke-width="1" opacity="1" /><text x="76" y="819" font-family="Arial" font-size="9" font-weight="750" fill="#F2D992" text-anchor="start" letter-spacing="0" >Homepage impact</text><text x="76" y="842" font-family="Arial" font-size="10" font-weight="600" fill="#FFFDF8" text-anchor="start" letter-spacing="0" >No direct Owner Home homepage projection is currently identified; implementation must reassess this before release.</text>
  </svg>